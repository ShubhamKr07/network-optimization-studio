services:
  - type: web
    name: nos-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/healthz
    # Platform-enforced drain budget for SIGTERM shutdown (see
    # docs/ops/shutdown-budget.md). Default is 30s; raised to 120s so a
    # long-running CBC solve has room to finish/interrupt cleanly before
    # SIGKILL. Below the 300s cap.
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nos-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGIN
        value: https://nos-studio.onrender.com
      - key: LOG_LEVEL
        value: info
      # PostHog analytics — read by src/lib/posthog.ts. Without
      # POSTHOG_API_KEY the client is null and all captures are no-ops.
      - key: POSTHOG_API_KEY
        value: phc_wLZvqpCAco2WwSiqjo5TFVEUzbLzKTLGtaA8EdxKmPmn
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: nos-studio
    runtime: static
    # NOTE: `corepack enable` removed 2026-09-18 — Render's build image now
    # ships pnpm at a read-only /usr/bin/pnpm, so `corepack enable`'s symlink
    # step fails with `EROFS: read-only file system, unlink '/usr/bin/pnpm'`.
    # `corepack prepare … --activate` pins pnpm@9 without that symlink step.
    # nos-studio is dashboard-managed, so this Blueprint edit keeps the spec
    # accurate; the live fix is the matching dashboard Build Command edit.
    buildCommand: >-
      corepack prepare pnpm@9 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter studio... --if-present run build
    staticPublishPath: artifacts/studio/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BASE_PATH
        value: /
      - key: PORT
        value: "10000"          # unused at runtime for a static site;
                                  # vite.config.ts just needs it present
                                  # and numeric at build time (G6)
      - key: VITE_API_BASE_URL
        # nos-api's actual assigned URL (the bare "nos-api" name was
        # already taken globally; Render appended a random suffix) —
        # confirmed live at deploy time, not the name-derived guess.
        value: https://nos-api-uwf8.onrender.com
      - key: NODE_VERSION
        value: "24"
      # Frontend PostHog (public project key — safe to expose, it's an ingest
      # key, not the personal API key). Unset ⇒ analytics no-ops (see
      # studio/src/lib/analytics.ts). nos-api keeps its own POSTHOG_API_KEY.
      - key: VITE_POSTHOG_KEY
        sync: false
      - key: VITE_POSTHOG_HOST
        value: https://us.i.posthog.com
      # Public DSN — safe to expose in the browser bundle (like the PostHog phc_ key).
      - key: VITE_SENTRY_DSN
        sync: false

databases:
  - name: nos-postgres
    plan: basic-256mb
    postgresMajorVersion: 16
