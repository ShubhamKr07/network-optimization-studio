name: Product Insights
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
  id-token: write
  pull-requests: write
jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 1 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Query PostHog aggregates
        env:
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
        run: |
          REPORT_DATE=$(date -u +%Y-%m-%d)
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          mkdir -p docs/product-insights
          REPORT_DATE=$REPORT_DATE npx tsx scripts/product-insights/run.ts
      # Claude does the whole job atomically: write the report file AND branch,
      # commit, push, open the PR. A separate bash step doesn't see the file the
      # action writes (its edits don't persist to the runner working tree for
      # later steps), so the git ops must happen inside the action via Bash.
      # Auth: the Claude GitHub App (no github_token input) provides git push +
      # PR permission; GH_TOKEN env lets the gh CLI open the PR.
      - name: Synthesize report and open PR
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 25 --allowedTools "Read,Write,Edit,Bash"'
          prompt: |
            Read the aggregates at docs/product-insights/aggregates.json (weekly
            usage aggregate counts only — no PII).

            Step 1 — Write a prioritized, concrete product-recommendations report
            in markdown to docs/product-insights/${{ env.REPORT_DATE }}-${{ github.run_number }}.md, focused
            on funnel drop-offs, solve failures/rejections, and
            stale-without-resolve behavior. Base every claim ONLY on the
            aggregates provided; never invent data. ALWAYS write the file, even if
            activity is low or every count is zero — in that case say plainly there
            was little or no activity this week and recommend nothing beyond
            continuing to collect data.

            Step 2 — Open a pull request with that file. Run these commands with
            the Bash tool, in order:
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git checkout -b product-insights/${{ env.REPORT_DATE }}-${{ github.run_number }}
              git add docs/product-insights/${{ env.REPORT_DATE }}-${{ github.run_number }}.md
              git commit -m "docs: weekly product insights ${{ env.REPORT_DATE }}"
              git push -u origin product-insights/${{ env.REPORT_DATE }}-${{ github.run_number }}
              gh pr create --base main --head product-insights/${{ env.REPORT_DATE }}-${{ github.run_number }} --title "Weekly product insights ${{ env.REPORT_DATE }}" --body "Automated PostHog weekly insights report (aggregate counts only, no PII). Review the recommendations before merging."
            Report the PR URL when done.
      # Keep only the newest open weekly-insights PR. The action above just
      # created this week's; close every older open product-insights/* PR and
      # delete its branch, so the review queue never accumulates stale reports.
      - name: Supersede older insight PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD=$(gh pr list --state open --json number,headRefName,createdAt \
            --jq '[.[] | select(.headRefName | startswith("product-insights/"))]
                  | sort_by(.createdAt) | reverse | .[1:] | .[].number')
          for n in $OLD; do
            echo "Superseding PR #$n"
            gh pr close "$n" \
              --comment "Superseded by a newer weekly product-insights report." \
              --delete-branch
          done
