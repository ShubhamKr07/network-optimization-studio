name: CI

# Runs on EVERY branch, not just main.
#
# ch5-delivery (2026-09-29) was a 25-commit feature branch merged by
# fast-forward with no PR, so with the old `branches: [main]` trigger CI never
# ran on any of its commits — the first run would have happened after the
# merge. `pnpm run typecheck` was consequently red from Task 4 through Task 7
# with nothing to catch it: one review reported having run it clean when it had
# not, and a later agent mis-attributed the failure to an unrelated test. It
# was found only when a human ran the command directly, four tasks late.
#
# Deliberately `branches-ignore: []` (all branches) rather than a pattern list
# like [main, 'ch*', 'bundle*']. A pattern list reopens the same gap silently
# the first time someone names a branch outside it, which is the exact failure
# mode this change exists to close.
#
# See docs/superpowers/gates/spec_gap.md.
on:
  push:
    branches-ignore: []
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nos_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install solver dependencies
        run: pip install pulp pytest

      # The Postgres service above starts EMPTY. This repo has no migration
      # files — schema lives only in lib/db/src/schema and is applied with
      # drizzle-kit push — so without this step every DB-touching suite fails
      # on `relation "users" does not exist`. That is what CI had been doing
      # since at least 4cf3bc1 (2026-09-26): 47+ red test files on every run,
      # for a repo whose local gates were green.
      #
      # `--force` skips drizzle-kit's data-loss confirmation prompt. Verified
      # non-interactive against a fresh empty database with stdin closed
      # (exit 0, 5 tables + UQ_solve_jobs_active_per_scenario created), so it
      # cannot hang a runner waiting on a TTY that isn't there.
      - name: Create database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Typecheck (whole workspace)
        run: pnpm run typecheck

      - name: API tests
        run: pnpm --filter api-server run test

      - name: Studio tests
        run: pnpm --filter studio run test

      - name: Solver test suite
        run: cd artifacts/api-server/src/solver && python3 -m pytest tests/ -x

      - name: Solver code quality
        run: |
          grep -nE '^\s*print\(' artifacts/api-server/src/solver/solve.py | grep -v 'print(json.dumps(result))' && { echo "stray print() in solve.py"; exit 1; } || true
          grep -n 'writeLP(' artifacts/api-server/src/solver/solve.py && { echo "writeLP() forbidden"; exit 1; } || true

      - name: Solver accuracy suite (X3 — sacred, must pass unmodified)
        run: cd artifacts/api-server/src/solver/tests && python3 e2e_accuracy.py

  # ---------------------------------------------------------------------------
  # e2e — Playwright against a real booted stack.
  #
  # BLOCKING as of 2026-09-30 (`continue-on-error: false`). This is the flip the
  # previous revision of this comment promised: the 11 catalogued test-rot specs
  # (docs/ops/e2e-stale-specs.md, 2026-09-11 audit) have been repaired, and the
  # last two stale specs — unfrozen when ch9-unlock reopened Chapter 9 and
  # `modelLock.ts` stopped skipping them — were rewritten in this same branch.
  #
  # It is also the gate `docs/superpowers/gates/spec_gap.md` proposed. That
  # cause has now recurred four times (bundle6.1, the OBS-3-audit block,
  # workspace-fixups-2, ch5-editable), every time the same way: a UI contract
  # changes, the unit suites stay green because Playwright specs are not in
  # `pnpm --filter studio test`, and a sibling spec nobody looked at goes red.
  # A non-blocking job cannot stop that; this one can.
  #
  # Keeping it green is now a merge requirement, not a courtesy. If a spec is
  # genuinely environment-blocked rather than wrong, skip it CONDITIONALLY on
  # the missing env var (the self-healing pattern in e2e/helpers/modelLock.ts)
  # so it re-arms by itself — never by reintroducing `continue-on-error`, which
  # silently un-gates every OTHER spec at the same time.
  #
  # labs.spec.ts stays excluded by playwright.config.ts's own testIgnore
  # (pre-D0, dead). @flaky specs are excluded here and run via e2e:quarantine.
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nos_ci

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The solver runs as a real subprocess during e2e solves, so its Python
      # deps are needed here too, not just in the `test` job.
      - name: Install solver dependencies
        run: pip install pulp pytest

      # Same reason as the `test` job: the Postgres service starts empty and
      # this repo has no migration files.
      - name: Create database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Install Playwright browsers
        run: pnpm --filter studio exec playwright install --with-deps chromium

      # `dev` builds then starts, so the server is listening only once build
      # finishes — hence the readiness wait below rather than a fixed sleep.
      # `nohup ... &` with redirected output, NOT a bare `&`. Each Actions
      # `run:` is its own shell, and a bare background job can take a SIGHUP
      # when that shell exits — which shows up later as an unexplained
      # connection-refused in the wait step rather than as a start failure.
      # Logs are captured so a boot failure is diagnosable from the run page.
      - name: Start api-server
        run: nohup pnpm --filter api-server run dev > /tmp/api.log 2>&1 &
        env:
          PORT: "3001"
          NODE_ENV: development

      - name: Start studio
        run: nohup pnpm --filter studio run dev > /tmp/studio.log 2>&1 &
        env:
          PORT: "5399"
          BASE_PATH: "/"
          API_PROXY_TARGET: "http://localhost:3001"
          # posthog-analytics.spec.ts and sentry-capture.spec.ts assert on a
          # real captured payload, so they need these at BUILD time (Vite
          # inlines VITE_* into the bundle — setting them on the Playwright
          # step instead would do nothing). They are the last two specs that
          # were failing for a non-code reason, and with the job now blocking
          # they have to be supplied rather than tolerated.
          #
          # Point these repository secrets at a TEST PostHog project and a
          # TEST Sentry DSN, not production: this fires on every push, and
          # CI traffic in a production analytics project is indistinguishable
          # from real user traffic after the fact.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Wait for both servers
        run: |
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health || echo 000)
            web=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5399/ || echo 000)
            # api/health answers 401 unauthenticated — any HTTP response means listening.
            if [ "$api" != "000" ] && [ "$web" = "200" ]; then
              echo "api=$api web=$web after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "servers did not come up (api=$api web=$web)"
          echo "--- api.log ---"; tail -40 /tmp/api.log || true
          echo "--- studio.log ---"; tail -40 /tmp/studio.log || true
          exit 1

      - name: e2e gate
        run: pnpm --filter studio run e2e:gate
        env:
          E2E_BASE_URL: http://localhost:5399

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/studio/e2e/report
          retention-days: 7
