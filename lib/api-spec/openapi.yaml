openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Network Optimization Studio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dataset
    description: Fixed dataset of warehouses and customers
  - name: scenarios
    description: Scenario management and optimization
  - name: Auth
    description: Browser and mobile authentication endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dataset:
    get:
      operationId: getDataset
      tags: [dataset]
      summary: Get the dataset for a given model
      description: Returns the warehouse/customer-shaped entities for the requested model (p-median-us's real warehouses/customers, or transport-coal's mines/stations mapped onto the same shape). Defaults to p-median-us.
      parameters:
        - name: modelId
          in: query
          required: false
          schema:
            type: string
            enum: [p-median-us, transport-coal, two-echelon-gold-au]
            default: p-median-us
      responses:
        "200":
          description: Dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "400":
          description: Unknown modelId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: List available solver models (registry-driven, see solvers/*/manifest.json)
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelInfo"

  /solve-history:
    get:
      operationId: getSolveHistory
      tags: [scenarios]
      summary: List the caller's most recent solve jobs across all scenarios (Phase 3.5, G3.2)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Recent solve jobs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SolveHistoryEntry"
        "401":
          description: Not authenticated

  /scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: List all scenarios
      parameters:
        - name: modelId
          in: query
          required: false
          description: Restrict the list to scenarios of this model (chapter pages scope by this).
          schema:
            type: string
            enum:
              - p-median-us
              - transport-coal
              - p-median-brazil
              - two-echelon-gold-au
              - max_coverage
              - p_center
              - set_cover
      responses:
        "200":
          description: List of scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
    post:
      operationId: createScenario
      tags: [scenarios]
      summary: Create a new scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioInput"
      responses:
        "201":
          description: Created scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "422":
          description: Missing or invalid modelId, or inputs fails model-specific validation

  /scenarios/{scenarioId}:
    get:
      operationId: getScenario
      tags: [scenarios]
      summary: Get a scenario by ID
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "404":
          description: Not found
    patch:
      operationId: updateScenario
      tags: [scenarios]
      summary: Update a scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdate"
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: inputs fails model-specific validation
    delete:
      operationId: deleteScenario
      tags: [scenarios]
      summary: Delete a scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated

  /scenarios/{scenarioId}/solve:
    post:
      operationId: solveScenario
      tags: [scenarios]
      summary: Enqueue an async solve job for a scenario (Phase 3.5, G3.1 — replaces the old blocking solve)
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Solve job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveJobQueued"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: Validation errors prevent solving, or (p-median-us) the scenario's network edits fail the semantic precheck (B2.1) — body carries the same `errors` shape as `GET /scenarios/{scenarioId}/precheck`
        "429":
          description: Solver worker pool is at capacity (queue depth threshold exceeded, P1.1); retry after the given delay
          headers:
            Retry-After:
              description: Suggested number of seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /scenarios/{scenarioId}/solve-jobs/{jobId}:
    get:
      operationId: getSolveJob
      tags: [scenarios]
      summary: Poll a solve job's status
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Solve job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveJob"
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /scenarios/{scenarioId}/precheck:
    get:
      operationId: precheckScenario
      tags: [scenarios]
      summary: Semantic precheck of a scenario's network-edit fields (SCN v0.3 Phase B, B2.1) — read-only, no DB writes. p-median-us only for now; other models return ok:true with no errors until B6.x extends this.
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Precheck result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrecheckResult"
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /scenarios/{scenarioId}/import:
    post:
      operationId: previewScenarioImport
      tags: [scenarios]
      summary: Parse and validate a CSV import against the scenario's current state, without applying it
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: Preview of errors, changes, and warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: Invalid entity, or this scenario's model doesn't support import

  /scenarios/{scenarioId}/import/apply:
    post:
      operationId: applyScenarioImport
      tags: [scenarios]
      summary: Re-validate and apply a CSV import onto the scenario's overrides
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportApplyRequest"
      responses:
        "200":
          description: Updated scenario, count of applied changes, and any non-blocking errors (partial mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportApplyResult"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: Invalid entity, model unsupported, or (all_or_nothing mode) the import had errors and nothing was applied

  /scenarios/{scenarioId}/reset-to-baseline:
    post:
      operationId: resetScenarioToBaseline
      tags: [scenarios]
      summary: Clear a scenario's warehouse and customer overrides, restoring the canonical dataset
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scenario with overrides cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: This scenario's model doesn't support reset-to-baseline

  /scenarios/{scenarioId}/clone:
    post:
      operationId: cloneScenario
      tags: [scenarios]
      summary: Clone a scenario (without result)
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Cloned scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /scenarios/{scenarioId}/export:
    get:
      operationId: exportScenario
      tags: [scenarios]
      summary: Export a scenario's warehouse or customer data, overrides merged over baseline
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
        - name: entity
          in: query
          required: true
          schema:
            type: string
            enum: [warehouses, customers, mines, stations, refineries, distances, laneCosts, legDistances, assignments, openWarehouses, costSummary, serviceStats]
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, json]
        - name: stubFor
          in: query
          required: false
          schema:
            type: string
          description: >-
            entity=distances or entity=laneCosts only (SCN v0.3 B4.3,
            extended by Task 30). Id of a warehouse/mine or customer/station
            (base dataset or this scenario's added entities) to generate a
            blank fill-in-the-blanks distance/cost template for — one row
            per counterpart (distance/cost omitted) — instead of exporting
            the scenario's existing distanceOverrides/laneCostOverrides.
      responses:
        "200":
          description: Export data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportEnvelope"
            text/csv:
              schema:
                type: string
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: Invalid entity/format, this scenario's model doesn't support export, stubFor used with an entity other than distances/laneCosts, or stubFor does not reference a known warehouse/mine or customer/station

  /scenarios/compare:
    post:
      operationId: compareScenarios
      tags: [scenarios]
      summary: Compare 2-4 solved scenarios that share a model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareInput"
      responses:
        "200":
          description: The compared scenarios, each with its opaque inputs and standardized result envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareResult"
        "400":
          description: scenarioIds must be an array of 2-4 integers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
        "404":
          description: One or more scenario IDs don't exist or aren't owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Scenarios don't share the same model, or one or more isn't solved/is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareRejection"

  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new student/instructor account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; caller is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '401':
          description: Invalid email or password (generic — no user enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Clear the current session
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

components:
  schemas:
    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [student, instructor]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    WarehouseCandidate:
      type: object
      description: Generic facility-candidate row, reused across models (warehouses, mines, refineries). `kind` distinguishes non-overridable supply nodes (two-echelon-gold-au's single mine) from overridable ones; omitted for models where every row is overridable.
      properties:
        id:
          type: string
        city:
          type: string
        state:
          type: string
        lat:
          type: number
        lng:
          type: number
        kind:
          type: string
          enum: [mine, facility]
      required: [id, city, state, lat, lng]

    Customer:
      type: object
      properties:
        id:
          type: string
        city:
          type: string
        state:
          type: string
        lat:
          type: number
        lng:
          type: number
        demand:
          type: number
      required: [id, city, state, lat, lng, demand]

    Dataset:
      type: object
      properties:
        warehouses:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseCandidate"
        customers:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
      required: [warehouses, customers]

    ModelInfo:
      type: object
      description: Registry-driven view of a solver model (Phase 3.5, G1.2) — sourced from solvers/<model-id>/manifest.json, datasetDir omitted (server-internal filesystem path).
      properties:
        id:
          type: string
        name:
          type: string
        chapter:
          type: string
        countryBounds:
          type: object
          properties:
            sw:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
            ne:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
          required: [sw, ne]
        capabilities:
          type: object
          properties:
            supportsP:
              type: boolean
            capacityModes:
              type: array
              items:
                type: string
            demandEditable:
              type: boolean
          required: [supportsP, capacityModes, demandEditable]
        inputsSchema:
          type: object
          description: JSON Schema describing this model's inputs shape. Opaque to this contract.
      required: [id, name, chapter, countryBounds, capabilities, inputsSchema]

    TransportAssignment:
      type: object
      properties:
        mineId:
          type: string
        stationId:
          type: string
        flowTons:
          type: number
        flowFraction:
          type: number
        distanceMi:
          type: number
      required: [mineId, stationId, flowTons, flowFraction, distanceMi]

    BandCoverage:
      type: object
      properties:
        band:
          type: integer
        percent:
          type: number
      required: [band, percent]

    WarehouseUtilization:
      type: object
      properties:
        warehouseId:
          type: string
        city:
          type: string
        utilization:
          type: number
      required: [warehouseId, city, utilization]

    Assignment:
      type: object
      properties:
        customerId:
          type: string
        warehouseId:
          type: string
        distanceMi:
          type: number
        band:
          type: integer
      required: [customerId, warehouseId, distanceMi, band]

    Edge:
      type: object
      description: Model-agnostic view of a solved flow (Phase 3.5, G2.1) — warehouse->customer assignment for p-median, mine->station shipment for transport LP, mine->refinery/refinery->customer shipment for two-echelon. flow is demand units or tons depending on the model. leg tags the echelon for two-echelon models only.
      properties:
        fromId:
          type: string
        toId:
          type: string
        flow:
          type: number
        distance:
          type: number
        band:
          type: integer
        leg:
          type: string
          enum: [mine_to_refinery, refinery_to_customer]
          description: Two-echelon models tag each edge with its leg so the map can style mine->refinery and refinery->customer differently. Absent for single-echelon models.
      required: [fromId, toId, flow, distance]

    LegAverageDistance:
      type: object
      properties:
        leg:
          type: string
        avgDistance:
          type: number
        totalFlow:
          type: number
      required: [leg, avgDistance, totalFlow]

    SolveMetrics:
      type: object
      properties:
        utilizationByNode:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseUtilization"
        bandCoverage:
          type: array
          items:
            $ref: "#/components/schemas/BandCoverage"
        weightedAvgDistance:
          type: number
        avgDistanceByLeg:
          type: array
          items:
            $ref: "#/components/schemas/LegAverageDistance"
          description: Two-echelon models emit per-leg average distance + total flow. Absent for single-echelon models.

    SolveResult:
      type: object
      description: Standardized result envelope (Phase 3.5, G2.1/Phase 4) — solve.py's raw stdout shape, unwrapped by no TS-side shim as of Phase 4.
      properties:
        status:
          type: string
          enum: [optimal, infeasible, error]
        objective:
          type: number
        runTimeSec:
          type: number
        quality:
          type: string
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
        metrics:
          $ref: "#/components/schemas/SolveMetrics"
        details:
          type: object
          description: Model-specific extras opaque to this contract — e.g. p-median's openWarehouseIds/assignments, transport's per-shipment flowFraction.
        solverUsed:
          type: string
        infeasibilityReason:
          type: ["string", "null"]
      required:
        - status
        - objective
        - runTimeSec
        - quality
        - edges
        - metrics
        - details
        - solverUsed
        - infeasibilityReason

    Scenario:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        modelId:
          type: string
          enum:
            - p-median-us
            - transport-coal
            - p-median-brazil
            - two-echelon-gold-au
            - max_coverage
            - p_center
            - set_cover
        inputs:
          type: object
          description: Opaque, model-specific input payload. Shape enforced per-model by artifacts/api-server/src/validation/inputs/, documented in docs/scenario-inputs-schema.md — not by this contract (Phase 3.5's model registry replaces this validation lookup with manifest-driven schemas without changing this field's shape).
        result:
          oneOf:
            - $ref: "#/components/schemas/SolveResult"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        stale:
          type: boolean
          description: Derived, never stored — true when inputs changed after the last solve (result is present but no longer reflects current inputs). Always false when result is null.
      required:
        - id
        - name
        - modelId
        - inputs
        - result
        - createdAt
        - updatedAt
        - stale

    SolveJobQueued:
      type: object
      properties:
        jobId:
          type: integer
      required: [jobId]

    SolveJobStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    SolveJob:
      type: object
      properties:
        id:
          type: integer
        status:
          $ref: "#/components/schemas/SolveJobStatus"
        error:
          type: ["string", "null"]
        resultSummary:
          type: ["object", "null"]
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: ["string", "null"]
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, status, error, resultSummary, queuedAt, startedAt, finishedAt]

    SolveHistoryEntry:
      type: object
      properties:
        id:
          type: integer
        scenarioId:
          type: integer
        scenarioName:
          type: string
        modelId:
          type: string
        status:
          $ref: "#/components/schemas/SolveJobStatus"
        objective:
          type: ["number", "null"]
        weightedAvgDistanceMi:
          type: ["number", "null"]
        runTimeSec:
          type: ["number", "null"]
        queuedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, scenarioId, scenarioName, modelId, status, objective, weightedAvgDistanceMi, runTimeSec, queuedAt, finishedAt]

    ScenarioInput:
      type: object
      properties:
        name:
          type: string
        modelId:
          type: string
          enum:
            - p-median-us
            - transport-coal
            - p-median-brazil
            - two-echelon-gold-au
            - max_coverage
            - p_center
            - set_cover
        inputs:
          type: object
      required:
        - name
        - modelId
        - inputs

    ScenarioUpdate:
      type: object
      properties:
        name:
          type: string
        inputs:
          type: object

    CompareInput:
      type: object
      properties:
        scenarioIds:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 4
      required: [scenarioIds]

    CompareResult:
      type: object
      description: One entry per requested scenario, in the request's order. Each is the full Scenario shape (opaque inputs + standardized result envelope) — F2.1's frontend diff engine interprets these generically rather than the server pre-flattening comparison metrics.
      properties:
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/Scenario"
      required: [scenarios]

    CompareRejection:
      type: object
      description: 422 body when one or more requested scenarios aren't eligible to compare (different models, or unsolved/stale).
      properties:
        error:
          type: string
        offendingIds:
          type: array
          items:
            type: integer
          description: IDs of scenarios that fail the comparison precondition (present for the unsolved/stale rejection; omitted for the differing-models rejection).
      required: [error]

    PrecheckError:
      type: object
      description: One structured, specific precheck finding (SCN v0.3 Phase B, B2.1) — e.g. "WH-09 missing distances to 4 customers, C-12, C-15, C-88, C-142".
      required: [code, message]
      properties:
        code:
          type: string
          enum: [completeness, id_collision, reference_integrity]
        message:
          type: string

    PrecheckResult:
      type: object
      description: Result of the semantic precheck against a scenario's addedWarehouses/addedCustomers/distanceOverrides fields (B1.1). Also the shape of the extra `errors` field on the solve route's 422 when the same precheck fails before enqueue.
      required: [ok, errors]
      properties:
        ok:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/PrecheckError"

    ImportRequest:
      type: object
      properties:
        entity:
          type: string
          enum: [warehouses, customers, mines, stations, refineries, distances, laneCosts, legDistances]
        csvText:
          type: string
      required: [entity, csvText]

    ImportError:
      type: object
      properties:
        errorClass:
          type: string
          enum: [format, syntax, logic]
        line:
          type: ["integer", "null"]
        message:
          type: string
      required: [errorClass, line, message]

    ImportRowChange:
      type: object
      properties:
        id:
          type: string
        line:
          type: integer
        before:
          type: object
        after:
          type: object
      required: [id, line, before, after]

    ImportPreview:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportError"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowChange"
        warnings:
          type: array
          items:
            type: string
      required: [errors, changes, warnings]

    ImportApplyRequest:
      type: object
      properties:
        entity:
          type: string
          enum: [warehouses, customers, mines, stations, refineries, distances, laneCosts, legDistances]
        csvText:
          type: string
        mode:
          type: string
          enum: [all_or_nothing, partial]
      required: [entity, csvText]

    ImportApplyResult:
      type: object
      properties:
        scenario:
          $ref: "#/components/schemas/Scenario"
        applied:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportError"
      required: [applied, errors]

    ExportEnvelope:
      type: object
      properties:
        templateVersion:
          type: integer
        entity:
          type: string
          enum: [warehouses, customers, mines, stations, refineries, distances, laneCosts, legDistances]
        rows:
          type: array
          items:
            type: object
      required: [templateVersion, entity, rows]
