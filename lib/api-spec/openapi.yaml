openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Network Optimization Studio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dataset
    description: Fixed dataset of warehouses and customers
  - name: scenarios
    description: Scenario management and optimization
  - name: Auth
    description: Browser and mobile authentication endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dataset:
    get:
      operationId: getDataset
      tags: [dataset]
      summary: Get the dataset for a given model
      description: Returns the warehouse/customer-shaped entities for the requested model (p-median-us's real warehouses/customers, transport-coal's mines/stations, or p-median-brazil's warehouses/regions, all mapped onto the same shape). Defaults to p-median-us.
      parameters:
        - name: modelId
          in: query
          required: false
          schema:
            type: string
            enum: [p-median-us, transport-coal, two-echelon-gold-au, p-median-brazil, two-echelon-jade-us, max-coverage-us, delivery-teaching-us, super-model]
            default: p-median-us
      responses:
        "200":
          description: Dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "400":
          description: Unknown modelId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: List available solver models (registry-driven, see solvers/*/manifest.json)
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelInfo"

  /models/{id}/reference-distances:
    get:
      operationId: getReferenceDistances
      tags: [models]
      summary: Get a model's immutable base×base reference-distance matrix (Bundle 2.2, B3)
      description: Unauthenticated, model-scoped, ownerless (matches /dataset and /models — no user_id, no 404-vs-403 concern). Returns the complete, unfiltered base×base distance matrix for the model — never includes scenario-local added entities or distanceOverrides (DD-1, base dataset files are read-only). The API disables Express's automatic ETags globally, so this route sets an explicit ETag derived from the dataset package's version/hash and supports If-None-Match revalidation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Reference distance matrix
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceDistances"
        "304":
          description: Not modified — the caller's If-None-Match header matched the current ETag
        "422":
          description: Known-but-unsupported model (capabilities.supportsReferenceDistances is false), or an unknown model id. This endpoint is ownerless — there is no "owned" resource concept to 404 on.

  /models/{id}/reference-costs:
    get:
      operationId: getReferenceCosts
      tags: [models]
      summary: Get a model's immutable base×base reference lane-cost matrix (Chapter 5, delivery-teaching-us)
      description: Unauthenticated, model-scoped, ownerless (matches /dataset and /models — no user_id, no 404-vs-403 concern). Returns the complete, unfiltered base×base lane-cost matrix for the model — never includes a scenario's own laneCostOverrides (DD-1, base dataset files are read-only). The API disables Express's automatic ETags globally, so this route sets an explicit ETag derived from the dataset package's version/hash and supports If-None-Match revalidation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Reference cost matrix
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceCosts"
        "304":
          description: Not modified — the caller's If-None-Match header matched the current ETag
        "422":
          description: Known-but-unsupported model (capabilities.supportsReferenceCosts is false), or an unknown model id. This endpoint is ownerless — there is no "owned" resource concept to 404 on.

  /solve-history:
    get:
      operationId: getSolveHistory
      tags: [scenarios]
      summary: The caller's most recent solve job per scenario (latest per scenario, newest first)
      parameters:
        - name: limit
          in: query
          required: false
          description: Max number of scenarios to return (one row each = that scenario's latest solve job)
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: At most one latest solve job per scenario, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SolveHistoryEntry"
        "401":
          description: Not authenticated

  /landing-summary:
    get:
      operationId: getLandingSummary
      tags: [scenarios]
      summary: Per-chapter + total scenario/solve counts for the caller (Bundle 4)
      responses:
        "200":
          description: The caller's landing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingSummary"
        "401":
          description: Not authenticated

  /scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: List all scenarios
      parameters:
        - name: modelId
          in: query
          required: false
          description: Restrict the list to scenarios of this model (chapter pages scope by this).
          schema:
            type: string
            enum:
              - p-median-us
              - transport-coal
              - p-median-brazil
              - two-echelon-gold-au
              - two-echelon-jade-us
              - max-coverage-us
              - delivery-teaching-us
              - super-model
      responses:
        "200":
          description: List of scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
    post:
      operationId: createScenario
      tags: [scenarios]
      summary: Create a new scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioInput"
      responses:
        "201":
          description: Created scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "422":
          description: Missing or invalid modelId, or inputs fails model-specific validation

  /scenarios/{scenarioId}:
    get:
      operationId: getScenario
      tags: [scenarios]
      summary: Get a scenario by ID
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "404":
          description: Not found
    patch:
      operationId: updateScenario
      tags: [scenarios]
      summary: Update a scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdate"
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "413":
          description: Request body exceeds the write limit, 2 MiB (4 MiB for super-model scenarios)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayloadTooLargeError"
        "422":
          description: inputs fails model-specific validation
    delete:
      operationId: deleteScenario
      tags: [scenarios]
      summary: Delete a scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated

  /scenarios/{scenarioId}/solve:
    post:
      operationId: solveScenario
      tags: [scenarios]
      summary: Enqueue an async solve job for a scenario (Phase 3.5, G3.1 — replaces the old blocking solve)
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Solve job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveJobQueued"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "409":
          description: A solve job is already queued or running for this scenario (CH4-11 — at most one active job per scenario). The body carries the in-flight `jobId` so the client can attach to the running job instead of retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveConflict"
        "422":
          description: Validation errors prevent solving, or (p-median-us) the scenario's network edits fail the semantic precheck (B2.1) — body carries the same `errors` shape as `GET /scenarios/{scenarioId}/precheck`
        "429":
          description: Solver worker pool is at capacity (queue depth threshold exceeded, P1.1); retry after the given delay
          headers:
            Retry-After:
              description: Suggested number of seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /scenarios/{scenarioId}/solve-jobs/{jobId}:
    get:
      operationId: getSolveJob
      tags: [scenarios]
      summary: Poll a solve job's status
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Solve job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveJob"
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /scenarios/{scenarioId}/precheck:
    get:
      operationId: precheckScenario
      tags: [scenarios]
      summary: Semantic precheck of a scenario's network-edit fields (SCN v0.3 Phase B, B2.1) — read-only, no DB writes. p-median-us only for now; other models return ok:true with no errors until B6.x extends this.
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Precheck result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrecheckResult"
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /scenarios/{scenarioId}/network/import:
    post:
      operationId: importScenarioNetwork
      tags: [scenarios]
      summary: Import a super-model network document (replace or merge) in one atomic write
      description: >-
        Super-model only. The body IS the network document (every key of the
        super inputs optional; unknown keys rejected). mode=replace resets
        absent keys to defaults; mode=merge upserts table rows by id/pair key
        and never deletes. The result is validated as a whole; any bad row
        writes nothing. A scenario that is not the caller's, or is not a
        super-model, is 404.
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum: [replace, merge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: The updated scenario
          content:
            application/json:
              schema:
                type: object
                required: [scenario]
                properties:
                  scenario:
                    $ref: "#/components/schemas/Scenario"
        "400":
          description: mode missing or not replace/merge, or the body is not valid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
        "404":
          description: Not found (also another user's scenario or a non-super scenario, never 403)
        "413":
          description: Request body exceeds the import wire limit, 4 MiB for super-model network import (checked after ownership)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayloadTooLargeError"
        "422":
          description: The document or the resulting network is invalid; nothing was written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkImportRejection"

  /scenarios/{scenarioId}/network/export:
    get:
      operationId: exportScenarioNetwork
      tags: [scenarios]
      summary: Export a super-model scenario's network as a JSON document (re-importable with mode=replace)
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [json]
      responses:
        "200":
          description: The network document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: format missing or not json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
        "404":
          description: Not found (also another user's scenario or a non-super scenario, never 403)

  /scenarios/{scenarioId}/network/road-distances:
    post:
      operationId: fetchScenarioRoadDistances
      tags: [scenarios]
      summary: Fetch OpenRouteService road distances for every plant→warehouse and warehouse→customer pair (super-model)
      description: >-
        Synchronous (up to 120 s). Sends every location's coordinates to OpenRouteService
        (driving-hgv), then writes only `inputs.roadDistances` onto the scenario's current
        inputs. Any failure writes nothing. Non-owned or non-super scenario is 404.
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The updated scenario
          content:
            application/json:
              schema:
                type: object
                required: [scenario]
                properties:
                  scenario:
                    $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "403":
          description: Model is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found (also another user's scenario or a non-super scenario, never 403)
        "409":
          description: road_distances_busy (another road-distance fetch is in progress on this server; nothing waits)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadDistancesError"
        "422":
          description: road_distances_unroutable, or the resulting inputs failed validation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RoadDistancesError"
                  - $ref: "#/components/schemas/NetworkImportRejection"
        "429":
          description: road_distances_quota (ORS daily quota 403 or per-minute 429)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadDistancesError"
        "502":
          description: road_distances_failed (timeout, deadline or an OpenRouteService error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadDistancesError"
        "503":
          description: road_distances_unavailable (no ORS_API_KEY on the server)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadDistancesError"

  /scenarios/{scenarioId}/import:
    post:
      operationId: previewScenarioImport
      tags: [scenarios]
      summary: Parse and validate a CSV or JSON import against the scenario's current state, without applying it
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: Preview of errors, changes, and warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "400":
          description: The request body is not valid JSON, or document violates ImportDocument (not an object, unknown top-level key, entity not an ImportEntity, unit not km/mi, rows not an array of objects). Only after auth and ownership — a non-owned scenario is 404 whatever the body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMalformedError"
        "401":
          description: Not authenticated
        "404":
          description: Not found (also a scenario owned by another user — never 403)
        "413":
          description: Request body exceeds the 2 MiB import wire limit (import routes only; checked after ownership)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayloadTooLargeError"
        "422":
          description: Invalid entity, format (incl. null) or unknown request key, csvText missing for a CSV import, or this scenario's model doesn't support the entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /scenarios/{scenarioId}/import/apply:
    post:
      operationId: applyScenarioImport
      tags: [scenarios]
      summary: Re-validate and apply a CSV or JSON import onto the scenario's overrides
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportApplyRequest"
      responses:
        "200":
          description: Updated scenario, count of applied changes, and any non-blocking errors (partial mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportApplyResult"
        "400":
          description: The request body is not valid JSON, or document violates ImportDocument (not an object, unknown top-level key, entity not an ImportEntity, unit not km/mi, rows not an array of objects). Only after auth and ownership — a non-owned scenario is 404 whatever the body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportMalformedError"
        "401":
          description: Not authenticated
        "404":
          description: Not found (also a scenario owned by another user — never 403)
        "413":
          description: Request body exceeds the 2 MiB import wire limit (import routes only; checked after ownership)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayloadTooLargeError"
        "422":
          description: Invalid entity, format, mode or unknown request key, model unsupported, merged inputs failed validation, or (all_or_nothing mode) the import had errors and nothing was applied — the last case carries the preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportApplyRejection"

  /scenarios/{scenarioId}/clone:
    post:
      operationId: cloneScenario
      tags: [scenarios]
      summary: Clone a scenario (without result)
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Cloned scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /scenarios/{scenarioId}/export:
    get:
      operationId: exportScenario
      tags: [scenarios]
      summary: Export a scenario's warehouse or customer data, overrides merged over baseline
      description: >-
        JADE Ch.9 workspace bundle (task A4, spec §5c): for
        two-echelon-jade-us, entity=assignments and entity=flows use
        model-specific schemas instead of the generic edges-derived export
        every other model gets (branched server-side on the scenario's
        modelId, entity enum unchanged). entity=assignments is
        product-level — one row per (product, customer) sourced from the
        solved result's details.assignments — with columns
        product,customer,assigned_warehouse,distance,distance_band (no
        demand/flow). entity=flows is ONE combined file spanning both legs,
        columns leg,from_id,to_id,distance,distance_band,flows: inbound
        plant_to_warehouse rows are aggregated per (plant,warehouse) pair
        with flows summed across products; outbound warehouse_to_customer
        rows are one per customer. distance_band is the range text from the
        shared label authority ("≤ a u", "a–b u", "> z u", upper-inclusive
        boundary, boundaries in the requested unit; never "Band N"), derived
        from the scenario's CURRENT SAVED inputs (distanceBands, and for the
        inbound leg inboundDistanceBands when saved) — it reflects the last
        saved bands, not unsaved UI edits. These two JADE grids are served
        in their own v4 envelopes (JadeAssignmentsExportEnvelope /
        JadeFlowsExportEnvelope). Every other model's assignments/flows
        export is unchanged (v3).
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
        - name: entity
          in: query
          required: true
          schema:
            type: string
            enum: [warehouses, customers, mines, stations, refineries, distances, laneCosts, legDistances, assignments, openWarehouses, costSummary, serviceStats, flows, plants, plantCapabilities, deliveryCosts]
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, json]
        - name: stubFor
          in: query
          required: false
          schema:
            type: string
          description: >-
            entity=distances or entity=laneCosts only (SCN v0.3 B4.3,
            extended by Task 30). Id of a warehouse/mine or customer/station
            (base dataset or this scenario's added entities) to generate a
            blank fill-in-the-blanks distance/cost template for — one row
            per counterpart (distance/cost omitted) — instead of exporting
            the scenario's existing distanceOverrides/laneCostOverrides.
        - name: unit
          in: query
          required: false
          schema: { type: string, enum: [km, mi] }
          description: >-
            Unit for distance-dimension values in the emitted file. Validated for
            EVERY entity; an unknown value is 400 even for a non-distance entity.
            Ignored (byte-identical output) for non-distance entities. Omitted =
            each model's canonical unit.
        - name: runId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: >-
            Export a specific solve run (a solve_jobs id owned by the caller AND
            belonging to this scenario) instead of the scenario's latest result.
      responses:
        "200":
          description: Export data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportEnvelope"
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid unit or runId (unit not km/mi, or runId not a positive integer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
        "404":
          description: Not found (also returned for a runId not owned by the caller or not belonging to this scenario)
        "409":
          description: >-
            SCND correctness A8 (§2.7.1) — the addressed result (the
            scenario's latest, or an explicit runId's) is a normalized-
            legacy/unverified read and cannot be exported as output data.
            Only output entities (assignments/openWarehouses/costSummary/
            serviceStats/flows) can return this; input/template exports
            never read a result. Re-solve the scenario to produce a
            verified result, then retry the export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyResultExportRejection"
        "422":
          description: Invalid entity/format, this scenario's model doesn't support export, stubFor used with an entity other than distances/laneCosts, stubFor does not reference a known warehouse/mine or customer/station, or runId addresses a legacy solve_jobs row whose full result was not retained

  /scenarios/{scenarioId}/distance-bands:
    patch:
      operationId: updateDistanceBands
      tags: [scenarios]
      summary: Field-scoped update of a scenario's distance bands (reporting lens only)
      description: >-
        Atomic, field-scoped update of inputs.distanceBands — never a
        read-modify-write of the whole inputs blob, so it cannot clobber a
        concurrent edit to any other input field. Does not bump
        inputsUpdatedAt (a bands-only change is a reporting lens, not a
        model-geometric change), so the returned Scenario.stale is
        unaffected.
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [distanceBands]
              properties:
                distanceBands:
                  type: array
                  minItems: 1
                  items: { type: number, exclusiveMinimum: 0 }
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: Invalid or missing body, or a model-invalid band array
        "401":
          description: Not authenticated
        "404":
          description: Not found (also returned for a scenario owned by another user)

  /scenarios/{scenarioId}/inbound-distance-bands:
    patch:
      operationId: updateInboundDistanceBands
      tags: [scenarios]
      summary: Field-scoped update of a scenario's inbound-lane distance bands (reporting lens only)
      description: >-
        Atomic, field-scoped update of inputs.inboundDistanceBands for the
        two-echelon models (two-echelon-jade-us, two-echelon-gold-au) — one
        jsonb statement, never a read-modify-write of the whole inputs blob.
        When the key is absent, inbound lanes fall back to
        inputs.distanceBands. Does not bump inputsUpdatedAt (a reporting lens,
        not a model-geometric change), so the returned Scenario.stale is
        unaffected. A model whose inputs schema has no such key (every
        single-echelon model) gets a 400.
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inboundDistanceBands]
              properties:
                inboundDistanceBands:
                  type: ["array", "null"]
                  minItems: 1
                  items: { type: number, exclusiveMinimum: 0 }
                  description: >-
                    Band boundaries. null clears the key: inbound lanes fall
                    back to distanceBands.
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: Invalid or missing body, a model-invalid band array, or a model without inbound bands
        "401":
          description: Not authenticated
        "403":
          description: The model's chapter is locked
        "404":
          description: Not found (also returned for a scenario owned by another user)

  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new student/instructor account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; caller is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '401':
          description: Invalid email or password (generic — no user enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Clear the current session
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset link
      description: >-
        Always answers 200, whether or not an account exists for the address,
        and answers before any lookup or send happens — a real lookup plus a
        Resend call is measurable against an instant miss, which would leak
        account existence even with an identical body. A failed send is
        therefore invisible to the caller and is reported to Sentry instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Request accepted. Reveals nothing about whether the account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordAccepted'
        '429':
          description: >-
            Per-address limit (3/hour) or a global flood cap (120/minute across
            all callers) tripped. Not per-IP: behind the proxy every caller
            shares one address. Returned regardless of whether the account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password using a reset token
      description: >-
        On success the caller is logged in, so a student lands straight in the
        app. The token is consumed by the same statement that writes the new
        hash, which is what makes it single-use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password changed; caller is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '400':
          description: >-
            Token unknown or expired (one message for both — distinct messages
            would tell a caller holding a guessed token whether it ever
            existed), or the password is outside the length bounds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: >-
            Global in-flight cap (4 concurrent resets) tripped. Bounds argon2
            CPU on an unauthenticated endpoint; checked before any hashing or
            body parsing, so a 429 costs no CPU. Not per-IP: behind the proxy
            every caller shares one address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /feedback:
    post:
      tags: [Feedback]
      operationId: submitFeedback
      summary: Submit anonymous product feedback
      description: >-
        Requires a session, which is used only to rate-limit the caller. No
        account identifier, session identifier, or client IP is persisted with
        the row — the stored record is body + timestamp and nothing else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '204':
          description: Feedback stored.
        '400':
          description: Body missing, empty after trimming, or over 4000 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded for this account.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [student, instructor]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: >-
            Normalized (trimmed + lowercased) by the server before validation,
            lookup, and insert — `Foo@X.com` and `foo@x.com` are one account.
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: >-
            The upper bound is a cost guard, not a policy preference: argon2 is
            deliberately CPU-expensive and the API runs on a 0.5-CPU instance,
            so an unbounded password lets one request starve every other
            student's.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: >-
            Normalized (trimmed + lowercased) by the server before lookup; the
            lookup itself is case-insensitive so accounts created before
            normalization still resolve.
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Same cost guard as registration — an over-length password is
            rejected before argon2 ever runs, and (per the no-enumeration rule)
            is indistinguishable from any other bad credential.
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: >-
            Normalized (trimmed + lowercased) by the server before lookup, the
            same as login.
    ForgotPasswordAccepted:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          description: >-
            The raw token from the reset link's URL fragment. Only its SHA-256
            hash is ever stored.
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: >-
            Same bounds as registration — deliberately one password standard,
            not two. The upper bound is the same argon2 cost guard described on
            RegisterRequest.password.
    FeedbackRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: >-
            Free-text feedback. Trimmed by the server before validation and
            before storage, so a whitespace-only body is rejected.
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    NetworkImportIssue:
      type: object
      required: [path, message]
      properties:
        path:
          type: array
          description: "Document-relative: [table or parameter, row index in the imported table, column]."
          items:
            oneOf:
              - type: string
              - type: integer
        message:
          type: string
    NetworkImportRejection:
      type: object
      required: [error, issues]
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/NetworkImportIssue"
    RoadDistancesErrorCode:
      type: string
      description: Closed set of road-distance failure codes (spec §8). The TS union in services/orsClient.ts mirrors it.
      enum: [road_distances_unavailable, road_distances_quota, road_distances_failed, road_distances_unroutable, road_distances_busy]
    RoadDistancesError:
      type: object
      required: [error, message]
      properties:
        error:
          $ref: "#/components/schemas/RoadDistancesErrorCode"
        message:
          type: string
    LegacyResultExportRejection:
      type: object
      description: >-
        SCND correctness A8 (§2.7.1) — the export endpoint's 409 body for a
        legacy/unverified output-entity export rejection. `code` is a
        stable, permanent machine-readable discriminator (never removed at
        a compatibility cleanup) the frontend uses to render a resolve
        prompt instead of a generic error toast.
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [LEGACY_RESULT_REQUIRES_RESOLVE]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        db:
          type: string
          enum: [ok, down]
          description: Database reachability (a SELECT 1 against the pool). `down` still returns 200 — the API process is up.
      required:
        - status
        - db

    WarehouseCandidate:
      type: object
      description: Generic facility-candidate row, reused across models (warehouses, mines, refineries). `kind` distinguishes non-overridable supply nodes (two-echelon-gold-au's single mine) from overridable ones; omitted for models where every row is overridable.
      properties:
        id:
          type: string
        name:
          type: string
          description: Display name (Chapter 9 JADE — the notebook's plant/warehouse label). Optional; other models leave it absent and render city/state instead.
        sourceId:
          type: integer
          description: Original notebook/textbook integer id, retained display-only (Chapter 9 JADE — canonical string id is the only valid join key). Optional; absent for models with no colliding source-id namespace.
        city:
          type: string
        state:
          type: string
        lat:
          type: number
        lng:
          type: number
        kind:
          type: string
          enum: [mine, facility]
        zip:
          type: string
          description: US zip or country-appropriate postal code, where available. Display-only — never a solver input.
      required: [id, city, state, lat, lng]

    Customer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Display name (Chapter 9 JADE — the notebook's customer label). Optional; other models leave it absent and render city/state instead.
        sourceId:
          type: integer
          description: Original notebook/textbook integer id, retained display-only (Chapter 9 JADE). Optional; absent for models with no colliding source-id namespace.
        city:
          type: string
        state:
          type: string
        lat:
          type: number
        lng:
          type: number
        demand:
          type: number
          description: Total demand across all products/units. For multi-product models (Chapter 9 JADE) this is the sum of `demands`' values; kept for shared map sizing and legacy consumers.
        demands:
          type: object
          description: "Optional per-product demand breakdown, keyed by product id (Chapter 9 JADE — `{productId: tons}`). Absent for single-product models; `demand` remains the scalar total."
          additionalProperties:
            type: number
        zip:
          type: string
          description: US zip or country-appropriate postal code, where available. Display-only — never a solver input.
      required: [id, city, state, lat, lng, demand]

    Plant:
      type: object
      description: Chapter 9 JADE — a supply-echelon facility (fixed, not a solver open/close decision) feeding warehouses. New entity, optional on Dataset so existing 4 models' responses stay valid.
      properties:
        id:
          type: string
        sourceId:
          type: integer
        name:
          type: string
        city:
          type: string
        state:
          type: string
        lat:
          type: number
        lng:
          type: number
      required: [id, city, state, lat, lng]

    Product:
      type: object
      description: Chapter 9 JADE — one of the 4 product families the model tracks per-customer demand and per-plant capability against.
      properties:
        id:
          type: string
        sourceId:
          type: integer
        name:
          type: string
      required: [id, name]

    PlantProductCapability:
      type: object
      description: Chapter 9 JADE — one base plant×product capability cell (tons). A zero/absent cell means that plant cannot make that product.
      properties:
        plantId:
          type: string
        productId:
          type: string
        capacity:
          type: number
      required: [plantId, productId, capacity]

    Dataset:
      type: object
      properties:
        warehouses:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseCandidate"
        customers:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        plants:
          type: array
          items:
            $ref: "#/components/schemas/Plant"
          description: Chapter 9 JADE only. Absent for models with no plant echelon.
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
          description: Chapter 9 JADE only. Absent for models with no product axis.
        plantProductCapabilities:
          type: array
          items:
            $ref: "#/components/schemas/PlantProductCapability"
          description: Chapter 9 JADE only — the base 16-cell plant×product capability matrix. Absent for models with no plant/product concept.
      required: [warehouses, customers]

    ModelInfo:
      type: object
      description: Registry-driven view of a solver model (Phase 3.5, G1.2) — sourced from solvers/<model-id>/manifest.json, datasetDir omitted (server-internal filesystem path).
      properties:
        id:
          type: string
        name:
          type: string
        chapter:
          type: string
        countryBounds:
          type: object
          properties:
            sw:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
            ne:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
          required: [sw, ne]
        capabilities:
          type: object
          properties:
            supportsP:
              type: boolean
            capacityModes:
              type: array
              items:
                type: string
            demandEditable:
              type: boolean
            outputGrids:
              type: array
              items:
                type: string
            supportsFacilityStatus:
              type: boolean
              description: True when the model has open/close + status facilities that R3 (status paint) and R7 (hide-closed) act on (Bundle 2, B2-T1). Gate R3/R7 on this, never on modelId.
            supportsReferenceDistances:
              type: boolean
              description: True when this model exposes its immutable base×base reference-distance matrix via GET /models/{id}/reference-distances (Bundle 2.2, B3). Only p-median-us today. Gate the reference-distances UI on this, never on modelId.
            supportsAddedCustomerExclusion:
              type: boolean
              description: True when this model's solver honors an Active/Excluded status on a user-added customer (addedCustomers[].status). p-median-us and two-echelon-gold-au only — p-median-brazil's solver applies no customer exclusion (Bundle 2.2, A3). Gate added-customer exclusion controls on this, never on modelId.
            supportsPlantProductCapability:
              type: boolean
              default: false
              description: Chapter 9 JADE only — true when this model has a plant echelon with a plant×product capability matrix editor. Optional, defaults false at the public boundary so existing manifests are unaffected. Gate the Capability Matrix UI on this, never on modelId.
            supportsReferenceCosts:
              type: boolean
              description: Chapter 5 (delivery-teaching-us) only — true when this model exposes its immutable base×base reference lane-cost matrix. The registry always emits this field (defaulting false for pre-existing manifests). Gate the reference-costs UI on this, never on modelId.
          required: [supportsP, capacityModes, demandEditable, outputGrids, supportsFacilityStatus, supportsReferenceDistances, supportsAddedCustomerExclusion, supportsReferenceCosts]
        inputsSchema:
          type: object
          description: JSON Schema describing this model's inputs shape. Opaque to this contract.
        distanceUnit:
          type: string
          description: Unit this model's distances/bands are reported in (Workspace UX R5). Server always emits a value, defaulting to "mi" if the manifest predates this field.
          enum: [mi, km]
      required: [id, name, chapter, countryBounds, capabilities, inputsSchema, distanceUnit]

    ReferenceDistancePair:
      type: object
      description: One base-warehouse×base-customer distance. fromCode/toCode echo fromId/toId (base entities' id IS already a short display code, e.g. "ALN"/"C1") — kept as separate fields to match the added-entity displayCode shape used elsewhere.
      properties:
        fromId:
          type: string
        fromCode:
          type: string
        toId:
          type: string
        toCode:
          type: string
        distance:
          type: number
        leg:
          type: string
          enum: [plant_to_warehouse, warehouse_to_customer]
          description: Chapter 9 JADE only — which leg this pair belongs to, since its single distances.json mixes both leg key-namespaces. Optional; absent for single-leg models.
      required: [fromId, fromCode, toId, toCode, distance]

    ReferenceDistances:
      type: object
      description: Immutable base×base reference-distance matrix for a supportsReferenceDistances-capable model (Bundle 2.2, B3). Never includes scenario-local added entities or distanceOverrides (DD-1).
      properties:
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceDistancePair"
        distanceUnit:
          type: string
          enum: [mi, km]
      required: [pairs, distanceUnit]

    ReferenceCostPair:
      type: object
      description: One base-warehouse×base-customer lane cost. fromCode/toCode echo fromId/toId (base entities' id IS already a short display code, e.g. "W8"/"C269") — kept as separate fields to match the added-entity displayCode shape used elsewhere.
      properties:
        fromId:
          type: string
        fromCode:
          type: string
        toId:
          type: string
        toCode:
          type: string
        cost:
          type: number
      required: [fromId, fromCode, toId, toCode, cost]

    ReferenceCosts:
      type: object
      description: Immutable base×base reference lane-cost matrix for a supportsReferenceCosts-capable model (Chapter 5, delivery-teaching-us). Never merged with a scenario's own laneCostOverrides (DD-1).
      properties:
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceCostPair"
        distanceUnit:
          type: string
          enum: [mi, km]
      required: [pairs, distanceUnit]

    TransportAssignment:
      type: object
      properties:
        mineId:
          type: string
        stationId:
          type: string
        flowTons:
          type: number
        flowFraction:
          type: number
        distanceMi:
          type: number
      required: [mineId, stationId, flowTons, flowFraction, distanceMi]

    BandCoverage:
      type: object
      properties:
        band:
          type: integer
        percent:
          type: number
      required: [band, percent]

    WarehouseUtilization:
      type: object
      properties:
        warehouseId:
          type: string
        city:
          type: string
        utilization:
          type: number
      required: [warehouseId, city, utilization]

    Assignment:
      type: object
      properties:
        customerId:
          type: string
        warehouseId:
          type: string
        distanceMi:
          type: number
        band:
          type: integer
      required: [customerId, warehouseId, distanceMi, band]

    Edge:
      type: object
      description: Model-agnostic view of a solved flow (Phase 3.5, G2.1) — warehouse->customer assignment for p-median, mine->station shipment for transport LP, mine->refinery/refinery->customer shipment for two-echelon-gold-au, plant->warehouse/warehouse->customer shipment for two-echelon-jade-us. flow is demand units or tons depending on the model. leg tags the echelon for two-echelon models only.
      properties:
        fromId:
          type: string
        toId:
          type: string
        flow:
          type: number
        distance:
          type: number
        band:
          type: integer
        leg:
          type: string
          enum: [mine_to_refinery, refinery_to_customer, plant_to_warehouse, warehouse_to_customer]
          description: Two-echelon models tag each edge with its leg so the map can style each leg differently. Absent for single-echelon models. Consumers must classify legs semantically (source->facility vs facility->demand), never assume only the Chapter-10 strings.
        productId:
          type: string
          description: Chapter 9 JADE — set on plant_to_warehouse (inbound) edges, one per positive (plant,warehouse,product) flow. Absent on warehouse_to_customer (outbound) edges, which aggregate across products per single-source customer, and absent for every other model.
      required: [fromId, toId, flow, distance]

    LegAverageDistance:
      type: object
      properties:
        leg:
          type: string
        avgDistance:
          type: number
        totalFlow:
          type: number
      required: [leg, avgDistance, totalFlow]

    SolveMetrics:
      type: object
      properties:
        utilizationByNode:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseUtilization"
        bandCoverage:
          type: array
          items:
            $ref: "#/components/schemas/BandCoverage"
        weightedAvgDistance:
          type: number
        avgDistanceByLeg:
          type: array
          items:
            $ref: "#/components/schemas/LegAverageDistance"
          description: Two-echelon models emit per-leg average distance + total flow. Absent for single-echelon models.
        openFacilityIds:
          type: array
          items:
            type: string
          description: Chapter 9 JADE — authoritative open-facility id list, including a facility with zero outbound flow (a forced-open warehouse serving no one still counts as open). Optional; other models derive their open set from edges/details instead.
        totalDemand:
          type: number
          description: Chapter 9 JADE — total effective demand (tons) across all customers/products, after exclusions. Optional.
        inboundCost:
          type: number
          description: Chapter 9 JADE — total plant->warehouse transport cost component of the objective. Optional.
        outboundCost:
          type: number
          description: Chapter 9 JADE — total warehouse->customer transport cost component of the objective. Optional.
        plantVariableCost:
          type: number
          description: Two-echelon shared core — total plant variable production cost (flow x per-ton plant cost), cents precision. 0 when no plant costs are set. Optional.
        totalCost:
          type: number
          description: Two-echelon shared core — inboundCost + outboundCost + plantVariableCost, summed from unrounded accumulators, cents precision. Optional.
        avgDistPlantToWh:
          type: number
          description: Two-echelon shared core — flow-weighted average plant->warehouse distance in miles, unrounded. Optional.
        avgDistWhToCustomer:
          type: number
          description: Two-echelon shared core — flow-weighted average warehouse->customer distance in miles, unrounded. Optional.
        transportRates:
          $ref: "#/components/schemas/TransportRates"

    # ch9-tc — Chapter 9 JADE: the four transportation cost parameters this
    # result was actually solved at, echoed by solve_jade. Canonical units
    # are $/ton-mile (rates) and $/ton (minimum charges) — the display-unit
    # toggle converts rates reciprocally at render time, never in storage.
    # Optional and never defaulted: a result stored before this field
    # existed simply omits it, and Compare labels that column's values as
    # the textbook fallback.
    TransportRates:
      type: object
      properties:
        icTransCost:
          type: number
          description: $ per ton-mile, plant -> warehouse.
        icMinTrans:
          type: number
          description: $ per ton minimum charge, plant -> warehouse.
        obTransCost:
          type: number
          description: $ per ton-mile, warehouse -> customer.
        obMinTrans:
          type: number
          description: $ per ton minimum charge, warehouse -> customer.
      required:
        - icTransCost
        - icMinTrans
        - obTransCost
        - obMinTrans

    # B3 — truthful status (solve.py's B2 already emits these). Mirrors
    # cbc_termination.py's SOLUTION_STATUSES plus the pre-existing "error"
    # sentinel solve.py uses for a load/dispatch failure that never reached a
    # solve attempt (the plan text names only the 5 CBC-classification
    # values; "error" is a real value solve.py emits too — hard rule #8
    # deviation, noted in the B3 commit body).
    SolutionStatus:
      type: string
      enum: [optimal, feasible, infeasible, unbounded, no_solution, error]
    # Mirrors cbc_termination.py's TERMINATION_REASONS verbatim, including
    # the legacy-only "unknown" sentinel.
    TerminationReason:
      type: string
      enum: [optimality_proven, gap_limit, time_limit, node_limit, infeasible, unbounded, unknown]

    SolveResult:
      type: object
      description: Standardized result envelope (Phase 3.5, G2.1/Phase 4) — solve.py's raw stdout shape, unwrapped by no TS-side shim as of Phase 4.
      properties:
        status:
          type: string
          enum: [optimal, infeasible, error, feasible, no_solution, unbounded]
          description: >-
            Deprecated truthful projection of solutionStatus, kept for
            backward compatibility with pre-B3 consumers. Expanded (B3) to
            the full truthful value set — a real gap-limited solve now
            reports "feasible" here instead of a hardcoded "optimal" (see B2).
            Prefer solutionStatus/terminationReason.
        solutionStatus:
          description: >-
            B3: the solver's real outcome classification, from CBC's own
            captured termination evidence (never the requested gap or
            wall-clock — see B1/B2). Null on a legacy stored result that
            predates this field (present as of B2 on every fresh solve) —
            callers must treat a null/absent solutionStatus as unverified,
            never as a proven-optimal claim.
          oneOf:
            - $ref: "#/components/schemas/SolutionStatus"
            - type: "null"
        terminationReason:
          description: >-
            Why the solver stopped. Null alongside a null/absent
            solutionStatus (legacy), or when solutionStatus is "error" (a
            load/dispatch failure before any solve was attempted).
          oneOf:
            - $ref: "#/components/schemas/TerminationReason"
            - type: "null"
        achievedGap:
          type: ["number", "null"]
          description: The gap CBC actually achieved (not the requested gapRel), from captured evidence, when known.
        solverIncumbentObjective:
          type: ["number", "null"]
          description: CBC's best incumbent objective from captured evidence, when known.
        solverBestBound:
          type: ["number", "null"]
          description: CBC's best bound from captured evidence, when known.
        objective:
          type: number
        runTimeSec:
          type: number
        quality:
          type: string
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
        metrics:
          $ref: "#/components/schemas/SolveMetrics"
        details:
          type: object
          description: Model-specific extras opaque to this contract — e.g. p-median's openWarehouseIds/assignments, transport's per-shipment flowFraction.
        solverUsed:
          type: string
        infeasibilityReason:
          type: ["string", "null"]
      required:
        - status
        - objective
        - runTimeSec
        - quality
        - edges
        - metrics
        - details
        - solverUsed
        - infeasibilityReason

    # A4 (SCND Correctness) — the public v2 result contract (§2.6/§2.7 of
    # docs/superpowers/specs/2026-09-21-scnd-solver-result-contract-design.md,
    # plan Task A4). STANDALONE and documentation-only as of A4: not
    # referenced by any operation yet — Scenario.result above stays
    # SolveResult, unchanged. v2 write/read activation is A6/A7/A8/A9/A11's
    # job. Defined now, and regenerated into lib/api-zod/lib/api-client-react
    # in this same commit (hard rule #1), so the contract is reviewable and
    # stable ahead of activation. Server-owned Zod (resultEnvelope.ts)
    # independently mirrors both schemas for runtime validation, per the
    # schema-authority split (Q83) — Orval's zod client only emits a runtime
    # schema for an operation-reachable component, and these two are
    # deliberately unreferenced, so "server-owned Zod" is the correct
    # authority for runtime parsing even though OpenAPI owns the shape.
    PublishedSolveResultV2:
      type: object
      description: >-
        The ONLY shape that reaches scenarios.result/public APIs once v2
        writes are active (§2.6 schema #3): the versioned success envelope
        plus the CURRENT job's requested gap/time-limit values, attached by
        composePublishedResult() identically on the fresh-solve and
        cache-hit paths so a cache hit never returns a different request's
        requested values.
      properties:
        envelopeVersion:
          type: integer
          enum: [2]
        status:
          type: string
          enum: [optimal, feasible, infeasible, unbounded, no_solution]
          description: v2 projection of solutionStatus (§2.3) — never "error"; every execution failure travels the private failure branch to a failed job + public errorCode instead of this envelope.
        solutionStatus:
          oneOf:
            - type: string
              enum: [optimal, feasible, infeasible, unbounded, no_solution]
            - type: "null"
        terminationReason:
          oneOf:
            - $ref: "#/components/schemas/TerminationReason"
            - type: "null"
        achievedGap:
          type: ["number", "null"]
        solverIncumbentObjective:
          type: ["number", "null"]
        solverBestBound:
          type: ["number", "null"]
        objective:
          type: ["number", "null"]
          description: >-
            Nullable when there is no incumbent (infeasible/unbounded/
            no_solution — §2.4). Deliberately more permissive than the
            adopted fd3 SolverSuccessEnvelopeV2 (A3), whose `objective` is
            still non-null: solve.py's infeasible/unbounded branches still
            emit a placeholder 0 today, a known gap outside this task's
            scope (a solve.py change, not owned by A4). This field is
            future-correct per §2.2/§2.4 ahead of that.
        runTimeSec:
          type: number
        quality:
          type: string
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
        metrics:
          $ref: "#/components/schemas/SolveMetrics"
        details:
          type: object
          description: Model-specific extras opaque to this contract.
        solverUsed:
          type: string
        infeasibilityReason:
          type: ["string", "null"]
        requestedGap:
          type: ["number", "null"]
          description: The CURRENT job's requested gap (§2.12) — composed after cache lookup, never baked into the cached entry itself.
        requestedGapSource:
          oneOf:
            - type: string
              enum: [request]
            - type: "null"
        requestedTimeLimitSec:
          type: ["number", "null"]
        requestedTimeLimitSource:
          oneOf:
            - type: string
              enum: [request]
            - type: "null"
        legacyUnverified:
          type: boolean
          enum: [false]
          description: Always false on a v2 published result — true only on a normalized-legacy read (see NormalizedSolveResult).
      required:
        - envelopeVersion
        - status
        - solutionStatus
        - terminationReason
        - achievedGap
        - solverIncumbentObjective
        - solverBestBound
        - objective
        - runTimeSec
        - quality
        - edges
        - metrics
        - details
        - solverUsed
        - infeasibilityReason
        - requestedGap
        - requestedGapSource
        - requestedTimeLimitSec
        - requestedTimeLimitSource
        - legacyUnverified

    NormalizedLegacySolveResult:
      type: object
      description: >-
        Read-time-only normalization (§2.7) of a stored legacy/pre-v2
        result — never backfilled, never re-solved. `status` is DEPRECATED
        and made null here specifically so a legacy read can never be
        confused with a truthful v2 claim; the raw historical value survives
        only as `legacyStatus`, isolated.
      properties:
        envelopeVersion:
          type: integer
          enum: [1]
        status:
          type: "null"
        solutionStatus:
          type: "null"
        terminationReason:
          type: string
          enum: [unknown]
        legacyUnverified:
          type: boolean
          description: >-
            A-fix (F1b): true ONLY for a genuinely pre-B row (neither
            solutionStatus nor terminationReason ever set). A row carrying
            real truthful-status evidence (Bundle B) but not yet v2-shaped
            is legacyUnverified:false — safe to export/un-badge.
        legacyStatus:
          type: string
          enum: [optimal, infeasible, error, feasible, no_solution, unbounded]
          description: The raw historical status field, isolated — never re-exposed as the truthful `status`.
        quality:
          type: string
          description: A non-proof legacy string (e.g. "Legacy result (unverified)") — never "Proven optimal"/"Optimal", which would recreate the false-proof defect B fixed.
        objective:
          type: ["number", "null"]
          description: Status/evidence-aware (§2.7) — a legitimately stored 0 is preserved; a legacy infeasible/error row's objective is null. `=== 0` alone is never the emptiness test.
        runTimeSec:
          type: number
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
        metrics:
          $ref: "#/components/schemas/SolveMetrics"
        details:
          type: object
        solverUsed:
          type: string
        infeasibilityReason:
          type: ["string", "null"]
        solverIncumbentObjective:
          type: "null"
        solverBestBound:
          type: "null"
        achievedGap:
          type: "null"
        requestedGap:
          type: "null"
        requestedGapSource:
          type: "null"
        requestedTimeLimitSec:
          type: "null"
        requestedTimeLimitSource:
          type: "null"
      required:
        - envelopeVersion
        - status
        - solutionStatus
        - terminationReason
        - legacyUnverified
        - legacyStatus
        - quality
        - objective
        - runTimeSec
        - edges
        - metrics
        - details
        - solverUsed
        - infeasibilityReason
        - solverIncumbentObjective
        - solverBestBound
        - achievedGap
        - requestedGap
        - requestedGapSource
        - requestedTimeLimitSec
        - requestedTimeLimitSource

    NormalizedSolveResult:
      description: >-
        The read/API/UI union (§2.6 schema #5): published v2, or
        normalized-legacy v1. Not yet wired into any live response — A8/A9
        activate consumers; defined now so the contract is stable and
        regenerable ahead of that.
      oneOf:
        - $ref: "#/components/schemas/PublishedSolveResultV2"
        - $ref: "#/components/schemas/NormalizedLegacySolveResult"

    Scenario:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        modelId:
          type: string
          enum:
            - p-median-us
            - transport-coal
            - p-median-brazil
            - two-echelon-gold-au
            - two-echelon-jade-us
            - max-coverage-us
            - delivery-teaching-us
            - super-model
        inputs:
          type: object
          description: Opaque, model-specific input payload. Shape enforced per-model by artifacts/api-server/src/validation/inputs/, documented in docs/scenario-inputs-schema.md — not by this contract (Phase 3.5's model registry replaces this validation lookup with manifest-driven schemas without changing this field's shape).
        result:
          oneOf:
            - $ref: "#/components/schemas/SolveResult"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        solvedAt:
          type: ["string", "null"]
          format: date-time
        stale:
          type: boolean
          description: Derived, never stored — true when inputs changed after the last solve (result is present but no longer reflects current inputs). Always false when result is null.
        resultRunId:
          type: integer
          nullable: true
          readOnly: true
          description: >-
            The solve_jobs id that produced this scenario's current `result`.
            Null for pre-migration solves, whose full result was not retained —
            such a history entry is non-exportable.
      required:
        - id
        - name
        - modelId
        - inputs
        - result
        - createdAt
        - updatedAt
        - solvedAt
        - stale
        - resultRunId

    SolveJobQueued:
      type: object
      properties:
        jobId:
          type: integer
      required: [jobId]

    SolveConflict:
      type: object
      properties:
        error:
          type: string
        jobId:
          type: integer
          description: The id of the queued or running job that blocked this request.
      required: [error, jobId]

    SolveJobStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    SolveJobErrorCode:
      type: string
      description: >-
        SCND correctness A5 (§2.11) — the permanent, exhaustive public
        failure-classification enum for a failed async solve job. `null` on
        every non-failed job. A historical row with no typed failure columns
        (pre-A1) reads as the conservative `SOLVE_FAILED` default, never
        `TIMEOUT` unless positively known. Every value here is retryable —
        there is no separate `retryable` field; the frontend derives the
        retry action from this enum alone (A-R47).
      enum: [SOLVE_FAILED, TIMEOUT]

    SolveJob:
      type: object
      properties:
        id:
          type: integer
        status:
          $ref: "#/components/schemas/SolveJobStatus"
        error:
          type: ["string", "null"]
          description: >-
            DEPRECATED transitional alias of `errorMessage` (never the raw
            stored diagnostic) — kept only for the pre-A11 compatibility
            window, removed at cleanup. Prefer `errorCode`/`errorMessage`.
        errorCode:
          description: >-
            The permanent public failure code. Never surfaces the internal
            `failureReason`/`failureStage`/`errorDetail` taxonomy or any raw
            solver diagnostic — see SolveJobErrorCode.
          oneOf:
            - $ref: "#/components/schemas/SolveJobErrorCode"
            - type: "null"
        errorMessage:
          type: ["string", "null"]
          description: >-
            A server-owned, fixed safe message for `errorCode` (§2.11's
            exhaustive mapping table) — e.g. "Solve failed" / "Solve timed
            out" / "Solve interrupted" / "Solve could not run — please try
            again". Never raw stdout/stderr/exception text or a filesystem
            path. `null` on every non-failed job.
        resultSummary:
          type: ["object", "null"]
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: ["string", "null"]
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, status, error, errorCode, errorMessage, resultSummary, queuedAt, startedAt, finishedAt]

    SolveHistoryEntry:
      type: object
      properties:
        id:
          type: integer
        scenarioId:
          type: integer
        scenarioName:
          type: string
        modelId:
          type: string
        status:
          $ref: "#/components/schemas/SolveJobStatus"
        objective:
          type: ["number", "null"]
        objectiveMode:
          type: ["string", "null"]
          description: The solve's objective mode (e.g. Chen's "coverage"/"min_distance") from result details, else null (D21/C4.10).
        weightedAvgDistance:
          type: ["number", "null"]
          description: Unit-agnostic weighted-average distance (companion to distanceUnit), superseding the mile-locked weightedAvgDistanceMi removed in C4.10 (D21).
        distanceUnit:
          type: string
          description: Distance unit for weightedAvgDistance ("mi"|"km"), derived from the model manifest; never null (a failed job still reports its model's unit) (D21/C4.10).
        errorCode:
          description: SCND correctness A5 (§2.11) — same permanent public failure code as SolveJob.errorCode; null for a non-failed row.
          oneOf:
            - $ref: "#/components/schemas/SolveJobErrorCode"
            - type: "null"
        errorMessage:
          type: ["string", "null"]
          description: SCND correctness A5 (§2.11) — same fixed safe message as SolveJob.errorMessage; null for a non-failed row.
        runTimeSec:
          type: ["number", "null"]
        legacyUnverified:
          type: boolean
          description: >-
            SCND correctness A8 (§2.7.1) — always emitted. True when this
            row's status is "succeeded" and its stored result does NOT
            parse as a canonical v2 published result (§2.6) — covers both
            historical-unversioned rows and B's truthful-but-unversioned
            rows (§2.14), never promoted to a proven claim. False for a
            non-succeeded row (no result to (un)verify) and for a genuine
            v2 published result.
        queuedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, scenarioId, scenarioName, modelId, status, objective, objectiveMode, weightedAvgDistance, distanceUnit, errorCode, errorMessage, runTimeSec, legacyUnverified, queuedAt, finishedAt]

    LandingSummary:
      type: object
      properties:
        perChapter:
          type: array
          items:
            $ref: "#/components/schemas/LandingSummaryChapter"
        totals:
          type: object
          properties:
            scenarios:
              type: integer
            solvedScenarios:
              type: integer
          required: [scenarios, solvedScenarios]
      required: [perChapter, totals]

    LandingSummaryChapter:
      type: object
      properties:
        modelId:
          type: string
        scenarioCount:
          type: integer
        solvedScenarioCount:
          type: integer
        lastSucceededSolveAt:
          type: ["string", "null"]
          format: date-time
      required: [modelId, scenarioCount, solvedScenarioCount, lastSucceededSolveAt]

    ScenarioInput:
      type: object
      properties:
        name:
          type: string
        modelId:
          type: string
          enum:
            - p-median-us
            - transport-coal
            - p-median-brazil
            - two-echelon-gold-au
            - two-echelon-jade-us
            - max-coverage-us
            - delivery-teaching-us
            - super-model
        inputs:
          type: object
      required:
        - name
        - modelId
        - inputs

    ScenarioUpdate:
      type: object
      properties:
        name:
          type: string
        inputs:
          type: object

    PrecheckError:
      type: object
      description: One structured, specific precheck finding (SCN v0.3 Phase B, B2.1) — e.g. "WH-09 missing distances to 4 customers, C-12, C-15, C-88, C-142".
      required: [code, message]
      properties:
        code:
          type: string
          enum: [completeness, id_collision, reference_integrity, p_range, capacity, zero_demand, no_feasible_route, objective_required, coefficient_range, avg_distance_cap_infeasible]
        message:
          type: string

    PrecheckResult:
      type: object
      description: Result of the semantic precheck against a scenario's addedWarehouses/addedCustomers/distanceOverrides fields (B1.1). Also the shape of the extra `errors` field on the solve route's 422 when the same precheck fails before enqueue.
      required: [ok, errors]
      properties:
        ok:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/PrecheckError"

    ImportEntity:
      type: string
      description: Importable input entities. Single source is lib/import-schema (IMPORT_ENTITIES); importSchemaContract.test.ts pins the two together.
      enum: [warehouses, customers, mines, stations, refineries, distances, laneCosts, legDistances, plants, plantCapabilities, deliveryCosts]

    ImportDocument:
      type: object
      description: >-
        The JSON envelope GET /scenarios/{scenarioId}/export?format=json emits,
        accepted back unchanged. Row keys are the entity's JSON keys
        (lib/import-schema). A row may omit templateVersion (it defaults to
        the envelope's). unit is present exactly for templateVersion 2 of a
        unit-bearing entity. Only these four top-level keys are allowed.
        Round trip = structural JSON equality of the re-export; added
        (scenario-local) entities round-trip into the same scenario only.
      example: { templateVersion: 1, entity: warehouses, rows: [{ templateVersion: 1, id: ALN, displayCode: null, city: Allentown, state: PA, lat: 40.602812, lng: -75.470433, capacity: null, status: forced_open, overridden: true }] }
      additionalProperties: false
      properties:
        templateVersion:
          type: integer
        entity:
          $ref: "#/components/schemas/ImportEntity"
        unit:
          type: string
          enum: [km, mi]
        rows:
          type: array
          items:
            type: object
      required: [templateVersion, entity, rows]

    ImportCsvRequest:
      type: object
      additionalProperties: false
      properties:
        entity:
          $ref: "#/components/schemas/ImportEntity"
        format:
          type: string
          enum: [csv]
          description: Optional; omitted means csv (backward compatible).
        csvText:
          type: string
      required: [entity, csvText]

    ImportJsonRequest:
      type: object
      additionalProperties: false
      properties:
        entity:
          $ref: "#/components/schemas/ImportEntity"
        format:
          type: string
          enum: [json]
        document:
          $ref: "#/components/schemas/ImportDocument"
      required: [entity, format, document]

    ImportRequest:
      oneOf:
        - $ref: "#/components/schemas/ImportCsvRequest"
        - $ref: "#/components/schemas/ImportJsonRequest"

    ImportError:
      type: object
      properties:
        errorClass:
          type: string
          enum: [format, syntax, logic]
        line:
          type: ["integer", "null"]
          description: CSV only — 1-based file line (header = 1). null for JSON imports and whole-file errors.
        rowIndex:
          type: integer
          minimum: 0
          description: JSON only — 0-based index into document.rows.
        field:
          type: string
          description: JSON only — the row key (or envelope key) the error is about, when one key is to blame.
        message:
          type: string
      required: [errorClass, line, message]

    ImportRowChange:
      type: object
      properties:
        id:
          type: string
        line:
          type: integer
          description: CSV-equivalent line (rowIndex + 2 for a JSON import).
        rowIndex:
          type: integer
          minimum: 0
          description: JSON only — 0-based index into document.rows.
        before:
          type: object
        after:
          type: object
      required: [id, line, before, after]

    ImportPreview:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportError"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowChange"
        warnings:
          type: array
          items:
            type: string
      required: [errors, changes, warnings]

    ImportApplyMode:
      type: string
      enum: [all_or_nothing, partial]

    ImportCsvApplyRequest:
      type: object
      additionalProperties: false
      properties:
        entity:
          $ref: "#/components/schemas/ImportEntity"
        format:
          type: string
          enum: [csv]
        csvText:
          type: string
        mode:
          $ref: "#/components/schemas/ImportApplyMode"
      required: [entity, csvText]

    ImportJsonApplyRequest:
      type: object
      additionalProperties: false
      properties:
        entity:
          $ref: "#/components/schemas/ImportEntity"
        format:
          type: string
          enum: [json]
        document:
          $ref: "#/components/schemas/ImportDocument"
        mode:
          $ref: "#/components/schemas/ImportApplyMode"
      required: [entity, format, document]

    ImportApplyRequest:
      oneOf:
        - $ref: "#/components/schemas/ImportCsvApplyRequest"
        - $ref: "#/components/schemas/ImportJsonApplyRequest"

    ImportMalformedError:
      type: object
      properties:
        error:
          type: string
        errorClass:
          type: string
          enum: [malformed]
        field:
          type: string
          description: The document key to blame, when one is (e.g. rows, entity, an unknown key).
      required: [error, errorClass]

    PayloadTooLargeError:
      type: object
      properties:
        error:
          type: string
          enum: [payload_too_large]
      required: [error]

    ImportApplyRejection:
      type: object
      description: 422 from import/apply. preview is present only for an all_or_nothing rejection.
      properties:
        error:
          type: string
        preview:
          $ref: "#/components/schemas/ImportPreview"
      required: [error]

    ImportApplyResult:
      type: object
      properties:
        scenario:
          $ref: "#/components/schemas/Scenario"
        applied:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportError"
      required: [applied, errors]

    # T5 (SCND scaling — Chen bands & units): the export endpoint returns three
    # versioned families, not one shape. A blanket v3+unit envelope would
    # misdescribe v1's unitless entities, so ExportEnvelope is a oneOf over
    # entity/version-scoped schemas instead. Placement rule (spec Part E):
    # v1 carries templateVersion+entity ONLY — no `unit` property at all; v2/v3
    # add `unit` on the envelope; rows in every family carry neither
    # envelope-level field.
    ExportEnvelopeV1:
      type: object
      description: >-
        Unitless export entities (warehouses, customers, mines, stations,
        refineries, plants, plantCapabilities, deliveryCosts, openWarehouses). Output is
        byte-identical whether or not `unit=` was supplied — deliberately no
        `unit` property on this schema.
      example: { templateVersion: 1, entity: warehouses, rows: [] }
      properties:
        templateVersion:
          type: integer
          enum: [1]
        entity:
          type: string
          enum: [warehouses, customers, mines, stations, refineries, plants, plantCapabilities, deliveryCosts, openWarehouses]
        rows:
          type: array
          description: Intentionally opaque (array of untyped objects). Exact per-entity row shapes differ across these entities and are enforced + tested at the services/templates.ts layer, not this contract.
          items:
            type: object
      required: [templateVersion, entity, rows]

    ExportEnvelopeV2:
      type: object
      description: >-
        Unit-bearing importable input entities (distances, legDistances,
        laneCosts). `unit` is the value's unit in this emitted file; import
        converts a different-but-known unit to the model's canonical unit.
      example: { templateVersion: 2, entity: distances, unit: km, rows: [] }
      properties:
        templateVersion:
          type: integer
          enum: [2]
        entity:
          type: string
          enum: [distances, legDistances, laneCosts]
        unit:
          type: string
          enum: [km, mi]
        rows:
          type: array
          description: >-
            Intentionally opaque. distances/legDistances rows carry
            {fromId, toId, distance}; laneCosts rows carry
            {fromId, toId, cost} (chapter vocabulary preserved) — enforced
            at services/templates.ts, not this contract.
          items:
            type: object
      required: [templateVersion, entity, unit, rows]

    # v3 output row shapes — copied verbatim from the spec's Part E "Exact v3
    # contracts" table. Band representation is schema-specific and never
    # conflated: generic rows carry a numeric index (-1 = overflow); JADE rows
    # carry the range-text label ("≤ a u" / "a–b u" / "> z u"; v4); serviceStats
    # carries the distance boundary itself in the requested unit (-1 =
    # overflow). OVERFLOW_BAND (-1) is a categorical sentinel, never converted.
    AssignmentExportRow:
      type: object
      description: Generic (non-JADE) assignment row — band is the zero-based index, -1 = overflow.
      properties:
        customerId: { type: string }
        warehouseId: { type: string }
        distance: { type: number }
        band: { type: integer }
        flow: { type: number }
      required: [customerId, warehouseId, distance, band, flow]

    FlowExportRow:
      type: object
      description: >-
        Generic (non-JADE) flow row — band is the zero-based index, -1 = overflow. For two-echelon models a
        row's band index is into that leg's band set (inbound legs use inboundDistanceBands when saved,
        otherwise distanceBands).
      properties:
        fromId: { type: string }
        toId: { type: string }
        distance: { type: number }
        band: { type: integer }
        flow: { type: number }
      required: [fromId, toId, distance, band, flow]

    JadeAssignmentExportRow:
      type: object
      description: two-echelon-jade-us product-level assignment row, sourced from details.assignments — band is the range text (`≤ a u`, `a–b u`, `> z u`) in the requested unit.
      properties:
        productId: { type: string }
        customerId: { type: string }
        warehouseId: { type: string }
        distance: { type: number }
        band: { type: string }
      required: [productId, customerId, warehouseId, distance, band]

    JadeFlowExportRow:
      type: object
      description: two-echelon-jade-us combined-leg flow row — band is the range text (`≤ a u`, `a–b u`, `> z u`) in the requested unit, classified against that leg's band set.
      properties:
        leg:
          type: string
          enum: [plant_to_warehouse, warehouse_to_customer]
        fromId: { type: string }
        toId: { type: string }
        distance: { type: number }
        band: { type: string }
        flows: { type: number }
      required: [leg, fromId, toId, distance, band, flows]

    ServiceStatsExportRow:
      type: object
      description: Cumulative + overflow coverage row — band is the distance BOUNDARY itself, converted to the requested unit (not an index); -1 = overflow.
      properties:
        band: { type: number }
        percent: { type: number }
      required: [band, percent]

    CostSummaryExportRow:
      type: object
      description: >-
        No band field — costSummary is not a band-bearing entity. B6
        whole-branch review Finding #2 — `quality` is a truthful derivation
        (never the solver's raw PuLP-promoted lpStatus), and `solutionStatus`/
        `terminationReason` are the evidence it's derived from; null on both
        for a legacy (pre-B2) result, where `quality` reads "Unverified".
        CH4O — `highServiceDist`/`coveragePct`/`coveredDemand` are the v4
        additions and are CONDITIONAL, not required: only max-coverage-us
        puts the three source fields on `details`, so for the other six
        models they are emitted as null (JSON) / blank (CSV). They are
        deliberately absent from `required` so a non-Chapter-4 producer that
        omits the keys entirely still satisfies this contract.
      properties:
        objective: { type: ["number", "null"] }
        objectiveMode: { type: ["string", "null"] }
        highServiceDist:
          type: ["number", "null"]
          description: max-coverage-us only — the scenario's high-service distance threshold; a plain distance, so it DOES convert under `unit=`.
        coveragePct:
          type: ["number", "null"]
          description: max-coverage-us only — percent of total demand inside the high-service threshold. A percent has no distance dimension and never converts under `unit=`.
        coveredDemand:
          type: ["number", "null"]
          description: max-coverage-us only — absolute demand units inside the high-service threshold. A demand count has no distance dimension and never converts under `unit=`.
        weightedAvgDistance: { type: ["number", "null"] }
        runTimeSec: { type: ["number", "null"] }
        quality: { type: string }
        solutionStatus: { type: ["string", "null"] }
        terminationReason: { type: ["string", "null"] }
        solverUsed: { type: string }
        totalCost:
          type: ["number", "null"]
          description: SM-4 (v5), two-echelon models only (super-model, jade) — monetary, never converts under `unit=`.
        inboundCost:
          type: ["number", "null"]
          description: SM-4 (v5), two-echelon models only — plant-to-warehouse transport cost; monetary, never converts.
        outboundCost:
          type: ["number", "null"]
          description: SM-4 (v5), two-echelon models only — warehouse-to-customer transport cost; monetary, never converts.
        plantVariableCost:
          type: ["number", "null"]
          description: SM-4 (v5), two-echelon models only — plant variable production cost; monetary, never converts.
        avgDistPlantToWh:
          type: ["number", "null"]
          description: SM-4 (v5), two-echelon models only — flow-weighted average plant-to-warehouse distance; a distance, so it DOES convert under `unit=`.
        avgDistWhToCustomer:
          type: ["number", "null"]
          description: SM-4 (v5), two-echelon models only — flow-weighted average warehouse-to-customer distance; a distance, so it DOES convert under `unit=`.
      required: [objective, objectiveMode, weightedAvgDistance, runTimeSec, quality, solutionStatus, terminationReason, solverUsed]

    AssignmentsExportEnvelope:
      type: object
      description: v3 assignments export — generic rows only (two-echelon-jade-us is served by JadeAssignmentsExportEnvelope at v4).
      example: { templateVersion: 3, entity: assignments, unit: mi, rows: [] }
      properties:
        templateVersion:
          type: integer
          enum: [3]
        entity:
          type: string
          enum: [assignments]
        unit:
          type: string
          enum: [km, mi]
        rows:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentExportRow"
      required: [templateVersion, entity, unit, rows]

    FlowsExportEnvelope:
      type: object
      description: v3 flows export — generic rows only (two-echelon-jade-us is served by JadeFlowsExportEnvelope at v4).
      example: { templateVersion: 3, entity: flows, unit: km, rows: [] }
      properties:
        templateVersion:
          type: integer
          enum: [3]
        entity:
          type: string
          enum: [flows]
        unit:
          type: string
          enum: [km, mi]
        rows:
          type: array
          items:
            $ref: "#/components/schemas/FlowExportRow"
      required: [templateVersion, entity, unit, rows]

    JadeAssignmentsExportEnvelope:
      type: object
      description: >-
        v4 two-echelon-jade-us assignments export. Grid-local version (services/templates.ts's
        JADE_EXPORT_TEMPLATE_VERSION): only the two JADE grids changed their `band` column to range text, so the
        shared v3 output version stays put for every other model. The enum is single-valued, and templateVersion
        keeps this envelope distinct from AssignmentsExportEnvelope even when rows is empty.
      example: { templateVersion: 4, entity: assignments, unit: mi, rows: [] }
      properties:
        templateVersion:
          type: integer
          enum: [4]
        entity:
          type: string
          enum: [assignments]
        unit:
          type: string
          enum: [km, mi]
        rows:
          type: array
          items:
            $ref: "#/components/schemas/JadeAssignmentExportRow"
      required: [templateVersion, entity, unit, rows]

    JadeFlowsExportEnvelope:
      type: object
      description: >-
        v4 two-echelon-jade-us flows export (grid-local version, see JadeAssignmentsExportEnvelope). Each leg's
        band text is classified against that leg's band set.
      example: { templateVersion: 4, entity: flows, unit: km, rows: [] }
      properties:
        templateVersion:
          type: integer
          enum: [4]
        entity:
          type: string
          enum: [flows]
        unit:
          type: string
          enum: [km, mi]
        rows:
          type: array
          items:
            $ref: "#/components/schemas/JadeFlowExportRow"
      required: [templateVersion, entity, unit, rows]

    CostSummaryExportEnvelope:
      type: object
      description: >-
        v5 costSummary export (SM-4: adds six optional two-echelon cost/leg-distance columns). objective converts under `unit=` per the
        shared seven-model objective-dimension mapping (lib/units/src/
        objective.ts); jade monetary and Chen coverage-percent do not
        convert. CH4O — costSummary is the one output grid on a GRID-LOCAL
        template version (services/templates.ts's
        COST_SUMMARY_TEMPLATE_VERSION), bumped to 4 for the three
        max-coverage-us row additions and to 5 for the six two-echelon columns while assignments/flows/serviceStats
        stay on the shared v3. The enum is SINGLE-VALUED on purpose: the
        route emits exactly COST_SUMMARY_TEMPLATE_VERSION, this envelope is
        computed per request and never persisted or re-imported, so a v3
        costSummary envelope can no longer exist — admitting 3 here would
        only let an emitter that drifted back off the constant pass
        validation.
      example: { templateVersion: 5, entity: costSummary, unit: km, rows: [] }
      properties:
        templateVersion:
          type: integer
          enum: [5]
        entity:
          type: string
          enum: [costSummary]
        unit:
          type: string
          enum: [km, mi]
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CostSummaryExportRow"
      required: [templateVersion, entity, unit, rows]

    ServiceStatsExportEnvelope:
      type: object
      description: v3 serviceStats export — cumulative + overflow rows under the requested unit.
      example: { templateVersion: 3, entity: serviceStats, unit: mi, rows: [] }
      properties:
        templateVersion:
          type: integer
          enum: [3]
        entity:
          type: string
          enum: [serviceStats]
        unit:
          type: string
          enum: [km, mi]
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ServiceStatsExportRow"
      required: [templateVersion, entity, unit, rows]

    ExportEnvelope:
      description: >-
        One of four versioned families (spec Part E): v1 unitless
        (warehouses/customers/mines/stations/refineries/plants/
        plantCapabilities/deliveryCosts/openWarehouses), v2 unit-bearing input
        (distances/legDistances/laneCosts), or v3 unit-bearing output
        (assignments/flows/serviceStats — plus costSummary, which is the
        same family but on its own grid-local version, v4 as of CH4O; see
        CostSummaryExportEnvelope), or the v4 two-echelon-jade-us family
        (JadeAssignmentsExportEnvelope / JadeFlowsExportEnvelope, range-text
        bands). Never a single global v3+unit shape.
      oneOf:
        - $ref: "#/components/schemas/ExportEnvelopeV1"
        - $ref: "#/components/schemas/ExportEnvelopeV2"
        - $ref: "#/components/schemas/AssignmentsExportEnvelope"
        - $ref: "#/components/schemas/FlowsExportEnvelope"
        - $ref: "#/components/schemas/JadeAssignmentsExportEnvelope"
        - $ref: "#/components/schemas/JadeFlowsExportEnvelope"
        - $ref: "#/components/schemas/CostSummaryExportEnvelope"
        - $ref: "#/components/schemas/ServiceStatsExportEnvelope"
