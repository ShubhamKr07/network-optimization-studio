openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Network Optimization Studio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dataset
    description: Fixed dataset of warehouses and customers
  - name: scenarios
    description: Scenario management and optimization
  - name: Auth
    description: Browser and mobile authentication endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dataset:
    get:
      operationId: getDataset
      tags: [dataset]
      summary: Get the fixed dataset
      description: Returns all 26 warehouse candidates and 200 customers
      responses:
        "200":
          description: Dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"

  /scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: List all scenarios
      parameters:
        - name: modelId
          in: query
          required: false
          description: Restrict the list to scenarios of this model (chapter pages scope by this).
          schema:
            type: string
            enum:
              - p-median-us
              - transport-coal
              - p-median-brazil
              - max_coverage
              - p_center
              - set_cover
      responses:
        "200":
          description: List of scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
    post:
      operationId: createScenario
      tags: [scenarios]
      summary: Create a new scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioInput"
      responses:
        "201":
          description: Created scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "422":
          description: Missing or invalid modelId, or inputs fails model-specific validation

  /scenarios/{scenarioId}:
    get:
      operationId: getScenario
      tags: [scenarios]
      summary: Get a scenario by ID
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "404":
          description: Not found
    patch:
      operationId: updateScenario
      tags: [scenarios]
      summary: Update a scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdate"
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: inputs fails model-specific validation
    delete:
      operationId: deleteScenario
      tags: [scenarios]
      summary: Delete a scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated

  /scenarios/{scenarioId}/solve:
    post:
      operationId: solveScenario
      tags: [scenarios]
      summary: Run the optimization solver for a scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scenario with solve result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: Validation errors prevent solving

  /scenarios/{scenarioId}/clone:
    post:
      operationId: cloneScenario
      tags: [scenarios]
      summary: Clone a scenario (without result)
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Cloned scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /scenarios/compare:
    post:
      operationId: compareScenarios
      tags: [scenarios]
      summary: Compare multiple solved scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareInput"
      responses:
        "200":
          description: Comparison metrics for each scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareResult"
        "401":
          description: Not authenticated

  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new student/instructor account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; caller is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '401':
          description: Invalid email or password (generic — no user enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Clear the current session
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

components:
  schemas:
    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [student, instructor]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    WarehouseCandidate:
      type: object
      properties:
        id:
          type: string
        city:
          type: string
        state:
          type: string
        lat:
          type: number
        lng:
          type: number
      required: [id, city, state, lat, lng]

    Customer:
      type: object
      properties:
        id:
          type: string
        city:
          type: string
        state:
          type: string
        lat:
          type: number
        lng:
          type: number
        demand:
          type: number
      required: [id, city, state, lat, lng, demand]

    Dataset:
      type: object
      properties:
        warehouses:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseCandidate"
        customers:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
      required: [warehouses, customers]

    TransportAssignment:
      type: object
      properties:
        mineId:
          type: string
        stationId:
          type: string
        flowTons:
          type: number
        flowFraction:
          type: number
        distanceMi:
          type: number
      required: [mineId, stationId, flowTons, flowFraction, distanceMi]

    BandCoverage:
      type: object
      properties:
        band:
          type: integer
        percent:
          type: number
      required: [band, percent]

    WarehouseUtilization:
      type: object
      properties:
        warehouseId:
          type: string
        city:
          type: string
        utilization:
          type: number
      required: [warehouseId, city, utilization]

    Assignment:
      type: object
      properties:
        customerId:
          type: string
        warehouseId:
          type: string
        distanceMi:
          type: number
        band:
          type: integer
      required: [customerId, warehouseId, distanceMi, band]

    SolveResult:
      type: object
      properties:
        status:
          type: string
          enum: [optimal, infeasible, solving, error]
        openWarehouseIds:
          type: array
          items:
            type: string
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
        objective:
          type: number
        weightedAvgDistanceMi:
          type: number
        bandCoverage:
          type: array
          items:
            $ref: "#/components/schemas/BandCoverage"
        utilization:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseUtilization"
        runTimeSec:
          type: number
        solverUsed:
          type: string
        infeasibilityReason:
          type: ["string", "null"]
      required:
        - status
        - assignments
        - weightedAvgDistanceMi
        - runTimeSec
        - solverUsed
        - infeasibilityReason

    Scenario:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        modelId:
          type: string
          enum:
            - p-median-us
            - transport-coal
            - p-median-brazil
            - max_coverage
            - p_center
            - set_cover
        inputs:
          type: object
          description: Opaque, model-specific input payload. Shape enforced per-model by artifacts/api-server/src/validation/inputs/, documented in docs/scenario-inputs-schema.md — not by this contract (Phase 3.5's model registry replaces this validation lookup with manifest-driven schemas without changing this field's shape).
        result:
          oneOf:
            - $ref: "#/components/schemas/SolveResult"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - modelId
        - inputs
        - result
        - createdAt
        - updatedAt

    ScenarioInput:
      type: object
      properties:
        name:
          type: string
        modelId:
          type: string
          enum:
            - p-median-us
            - transport-coal
            - p-median-brazil
            - max_coverage
            - p_center
            - set_cover
        inputs:
          type: object
      required:
        - name
        - modelId
        - inputs

    ScenarioUpdate:
      type: object
      properties:
        name:
          type: string
        inputs:
          type: object

    CompareInput:
      type: object
      properties:
        scenarioIds:
          type: array
          items:
            type: integer
          minItems: 2
      required: [scenarioIds]

    ScenarioMetrics:
      type: object
      properties:
        scenarioId:
          type: integer
        name:
          type: string
        openSites:
          type: array
          items:
            type: string
        weightedAvgDistanceMi:
          type: number
        objective:
          type: number
        bandDemandPercent:
          type: array
          items:
            $ref: "#/components/schemas/BandCoverage"
        avgUtilization:
          type: number
        solverStatus:
          type: string
      required:
        - scenarioId
        - name
        - openSites
        - weightedAvgDistanceMi
        - objective
        - bandDemandPercent
        - avgUtilization
        - solverStatus

    CompareResult:
      type: object
      properties:
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioMetrics"
      required: [scenarios]
