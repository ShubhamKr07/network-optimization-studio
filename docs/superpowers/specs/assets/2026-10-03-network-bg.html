<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Network background animation</title>
<style>
html,body{margin:0;height:100%;background:#F5F6F1}
.demo{position:relative;height:100%;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#5B5F54}
.demo>*{position:relative}
</style>
</head>
<body>
<div class="demo">
  <network-bg></network-bg>
  <p>Content sits on top — the animation ignores clicks.</p>
</div>
<script>
/* <network-bg> — drifting grey network animation.
   Usage: drop this script in, then place <network-bg></network-bg> inside any
   position:relative container. It fills the container, sits behind content,
   and ignores pointer events.
   Optional attributes: nodes="26" hubs="5" color="128,132,122" */
(function () {
  class NetworkBG extends HTMLElement {
    connectedCallback() {
      this.style.cssText = "position:absolute;inset:0;pointer-events:none;display:block";
      var canvas = document.createElement("canvas");
      canvas.style.cssText = "width:100%;height:100%;display:block";
      canvas.setAttribute("aria-hidden", "true");
      this.appendChild(canvas);
      var ctx = canvas.getContext("2d"), w, h, raf;
      var N = parseInt(this.getAttribute("nodes") || "26", 10);
      var HUBS = parseInt(this.getAttribute("hubs") || "5", 10);
      var C = this.getAttribute("color") || "128,132,122";
      var resize = function () { w = canvas.width = canvas.offsetWidth; h = canvas.height = canvas.offsetHeight; };
      resize();
      var nodes = [];
      for (var i = 0; i < N; i++) nodes.push({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - 0.5) * 0.00022, vy: (Math.random() - 0.5) * 0.00022,
        hub: i < HUBS, r: i < HUBS ? 7 : 4
      });
      function tick() {
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < N; i++) {
          var n = nodes[i];
          n.x += n.vx; n.y += n.vy;
          if (n.x < 0 || n.x > 1) n.vx *= -1;
          if (n.y < 0 || n.y > 1) n.vy *= -1;
        }
        ctx.lineWidth = 1.6;
        for (var a = 0; a < N; a++) for (var b = a + 1; b < N; b++) {
          if (!nodes[a].hub && !nodes[b].hub) continue;
          var dx = (nodes[a].x - nodes[b].x) * w, dy = (nodes[a].y - nodes[b].y) * h, d = Math.sqrt(dx * dx + dy * dy);
          if (d < 340) {
            ctx.strokeStyle = "rgba(" + C + "," + (0.16 * (1 - d / 340)).toFixed(3) + ")";
            ctx.beginPath(); ctx.moveTo(nodes[a].x * w, nodes[a].y * h); ctx.lineTo(nodes[b].x * w, nodes[b].y * h); ctx.stroke();
          }
        }
        for (var j = 0; j < N; j++) {
          var m = nodes[j];
          ctx.fillStyle = m.hub ? "rgba(" + C + ",0.28)" : "rgba(" + C + ",0.2)";
          if (m.hub) ctx.fillRect(m.x * w - m.r, m.y * h - m.r, m.r * 2, m.r * 2);
          else { ctx.beginPath(); ctx.arc(m.x * w, m.y * h, m.r, 0, Math.PI * 2); ctx.fill(); }
        }
        raf = requestAnimationFrame(tick);
      }
      tick();
      this._cleanup = function () { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
      window.addEventListener("resize", resize);
    }
    disconnectedCallback() { if (this._cleanup) this._cleanup(); }
  }
  customElements.define("network-bg", NetworkBG);
})();
</script>
</body>
</html>
