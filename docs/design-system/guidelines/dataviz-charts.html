<!-- @dsCard group="Data Viz" viewport="700x180" subtitle="Chart series colors and coverage bar" name="Chart colors" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px 20px;background:var(--surface-card);font-family:var(--font-mono)}
.row{display:flex;gap:8px;margin-bottom:14px}.sw{flex:1}.chip{height:34px;border-radius:var(--radius-sm)}
.l{font-size:10px;color:var(--text-muted);margin-top:4px}
.bar{display:flex;height:18px;border-radius:var(--radius-sm);overflow:hidden}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--chart-1)"></div><div class="l">chart-1</div></div>
<div class="sw"><div class="chip" style="background:var(--chart-2)"></div><div class="l">chart-2</div></div>
<div class="sw"><div class="chip" style="background:var(--chart-3)"></div><div class="l">chart-3</div></div>
<div class="sw"><div class="chip" style="background:var(--chart-4)"></div><div class="l">chart-4</div></div>
<div class="sw"><div class="chip" style="background:var(--chart-5)"></div><div class="l">chart-5</div></div>
</div>
<div class="bar">
<div style="width:42%;background:var(--band-0)"></div><div style="width:26%;background:var(--band-1)"></div><div style="width:17%;background:var(--band-2)"></div><div style="width:10%;background:var(--band-3)"></div><div style="width:5%;background:var(--band-4)"></div>
</div>
<div class="l" style="margin-top:4px">demand coverage by distance band · axis labels mono 10px · gridlines var(--chart-grid)</div>
</body></html>
