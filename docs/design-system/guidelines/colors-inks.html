<!-- @dsCard group="Colors" viewport="700x150" subtitle="Warm inks and papers" name="Inks & papers" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;font-family:var(--font-mono);background:var(--surface-card)}
.row{display:flex;gap:8px}.sw{flex:1}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.l{font-size:10px;color:var(--text-muted);margin-top:6px}.h{font-size:10px;color:var(--text-faint)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="l">ink-900</div><div class="h">#181A15</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="l">ink-700</div><div class="h">#33362E</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="l">ink-500</div><div class="h">#5B5F54</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-400)"></div><div class="l">ink-400</div><div class="h">#83887A</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="l">ink-300</div><div class="h">#ADB1A4</div></div>
<div class="sw"><div class="chip" style="background:var(--line)"></div><div class="l">line</div><div class="h">#E2E4DA</div></div>
<div class="sw"><div class="chip" style="background:var(--paper-2)"></div><div class="l">paper-2</div><div class="h">#F5F6F1</div></div>
<div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="l">paper</div><div class="h">#FCFCFA</div></div>
<div class="sw"><div class="chip" style="background:var(--white)"></div><div class="l">white</div><div class="h">#FFFFFF</div></div>
</div>
</body></html>
