<!-- @dsCard group="Colors" viewport="700x140" subtitle="Status colors with tinted backgrounds" name="Status" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--surface-card);display:flex;gap:12px}
.s{flex:1;border-radius:var(--radius-md);padding:12px;border:1px solid}
.t{font-weight:600;font-size:13px}.m{font-family:var(--font-mono);font-size:10px;margin-top:6px;opacity:.75}
</style></head><body>
<div class="s" style="background:var(--success-bg);border-color:var(--success-border);color:var(--success)"><div class="t">Success</div><div class="m">solve succeeded · #16A34A</div></div>
<div class="s" style="background:var(--warning-bg);border-color:var(--warning-border);color:var(--warning)"><div class="t">Warning</div><div class="m">stale — inputs changed · #B45309</div></div>
<div class="s" style="background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)"><div class="t">Danger</div><div class="m">solve failed · #DC2626</div></div>
</body></html>
