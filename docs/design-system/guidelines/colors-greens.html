<!-- @dsCard group="Colors" viewport="700x150" subtitle="Leaf green ramp sampled from the cover" name="Greens" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>

.l{font-size:10px;color:var(--text-muted);margin-top:6px}.h{font-size:10px;color:var(--text-faint)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--green-050)"></div><div class="l">green-050</div><div class="h">#F4F7EB</div></div>
<div class="sw"><div class="chip" style="background:var(--green-100)"></div><div class="l">green-100</div><div class="h">#E7EED4</div></div>
<div class="sw"><div class="chip" style="background:var(--green-200)"></div><div class="l">green-200</div><div class="h">#CDDCA6</div></div>
<div class="sw"><div class="chip" style="background:var(--green-300)"></div><div class="l">green-300</div><div class="h">#AFC975</div></div>
<div class="sw"><div class="chip" style="background:var(--green-400)"></div><div class="l">green-400</div><div class="h">#93B747</div></div>
<div class="sw"><div class="chip" style="background:var(--green-500)"></div><div class="l">green-500</div><div class="h">#7DA436</div></div>
<div class="sw"><div class="chip" style="background:var(--green-600)"></div><div class="l">green-600</div><div class="h">#5F7F28</div></div>
<div class="sw"><div class="chip" style="background:var(--green-700)"></div><div class="l">green-700</div><div class="h">#48611E</div></div>
<div class="sw"><div class="chip" style="background:var(--green-800)"></div><div class="l">green-800</div><div class="h">#324414</div></div>
</div>
</body></html>
