<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Radii, hairlines, and the three shadows" name="Shape & elevation" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px 20px;background:var(--surface-page);font-family:var(--font-mono);display:flex;gap:12px}
.c{flex:1;background:var(--surface-card);padding:12px;font-size:10px;color:var(--text-muted);display:flex;flex-direction:column;gap:4px;justify-content:center}
</style></head><body>
<div class="c" style="border:1px solid var(--line);border-radius:var(--radius-sm)"><b style="color:var(--text-body)">radius-sm 3px</b>chips, swatches</div>
<div class="c" style="border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"><b style="color:var(--text-body)">radius-md 4px + shadow-sm</b>buttons, inputs, cards</div>
<div class="c" style="border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"><b style="color:var(--text-body)">radius-lg 6px + shadow-md</b>panels, popovers</div>
<div class="c" style="border:1px solid var(--border-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay)"><b style="color:var(--text-body)">shadow-overlay</b>dialogs only</div>
</body></html>
